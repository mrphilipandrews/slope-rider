        setTimeout(() => f.m.focus({ preventScroll: true }), 80);
      },
      read() {
        if (!f.m.value.trim() || !f.c.value.trim()) return { status: 'empty', msg: 'Fill in both boxes, m and c. If there is no number on the end, type 0.' };
        ans = L.parseEq(f.m.value, f.c.value);
        if (ans.status === 'invalid') return { status: 'invalid', msg: ans.mixed ? MIXED_MSG : INVALID_MSG };
        if (L.roundedGradient(ans, d.m)) return { status: 'rounded', msg: ROUNDED_MSG };
        return { status: 'ok' };
      },
      check() {
        const okM = qeq(ans.m, d.m), okC = qeq(ans.c, d.c);
        markInput(f.m, okM); markInput(f.c, okC);
        return { correct: okM && okC, msg: lineMsg(L.diagnose(ans.m, ans.c, d.m, d.c)) };
      },
      async play(res) {
        g.clearLayer('scratch');
        if (res.correct) { await rideTrue(g, d.m, d.c, this.gates); return; }
        if (ans.m.n !== 0 && L.qsign(ans.m) !== L.qsign(d.m)) g.arrowFlash();
        await rideStudent(g, ans.m, ans.c, this.gates);
      },
      hint(level) {
        if (level === 1) return 'Start with the <b>Base Station</b>. Where does the run cross the y-axis? That number is <b>c</b>.';
        const [base, P1, P2] = this.pair();
        g.station(base, 'BASE STATION', { cls: 'cyan', layer: 'guides' });
        g.triangle(P1, P2);
        return `c = ${fmt(d.c.n)}. From ${P1 === base ? 'the Base Station' : 'the left gate'}: run ${P2.x - P1.x}, rise ${fmt(P2.y - P1.y)}. Gradient is rise ÷ run.`;
      },
      // The Base Station and the gate next to it, left to right.
      pair() {
        const base = gts.find(p => p.x === 0), other = gts.find(p => p.x > 0) || gts.find(p => p.x < 0);
        return other.x > 0 ? [base, base, other] : [base, other, base];
      },
      solve() {
        const [base, P1, P2] = this.pair();
        g.clearLayer('guides');
        g.station(base, 'BASE STATION', { cls: 'cyan', layer: 'guides' });
        g.triangle(P1, P2);
        const mistake = eqMistake(ans, d);
        f.m.value = qInput(d.m);
        f.c.value = fmt(d.c.n);
        markInput(f.m, true); markInput(f.c, true);
        return mistake + stepList([
          `<b>Find c.</b> c is where the run crosses the y-axis, where x = 0. It crosses at the Base Station ${pt(base)}, so <b>c = ${fmt(d.c.n)}</b>.`,
          ...countSteps(P1, P2),
          `<b>Write the equation.</b> Put m and c into y = mx + c: ${eq(eqStr(d.m, d.c))}`,
          checkStep(d, P1 === base ? P2 : P1)
        ]);
      },
      lock(on) { f.lock(on); }
    };
  }

  // Double Black: equation from two gates, no graph.
  function qTwoPoint(d) {
    const { A, B } = d, run = B.x - A.x, rise = B.y - A.y;
    let g, panel, f, ans, fog;
    const reveal = () => {
      if (!fog) return;
      fog.remove(); fog = null;
      this_.gates = gateFlags(g, [A, B]);
      letterFlag(g, A, 'A'); letterFlag(g, B, 'B');
    };
    const this_ = {
      key: 'two' + JSON.stringify([A, B]),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say(`No map! Gate <b>A</b> is at <b>${pt(A)}</b> and Gate <b>B</b> is at <b>${pt(B)}</b>. Write the equation of the run through both.`);
        fog = g.fog(['NO MAP!', 'Work it out from the gates.']);
        f = eqField(panel.work);
        setTimeout(() => f.m.focus({ preventScroll: true }), 80);
      },
      read() {
        if (!f.m.value.trim() || !f.c.value.trim()) return { status: 'empty', msg: 'Fill in both boxes, m and c. If there is no number on the end, type 0.' };
        ans = L.parseEq(f.m.value, f.c.value);
        if (ans.status === 'invalid') return { status: 'invalid', msg: ans.mixed ? MIXED_MSG : INVALID_MSG };
        if (L.roundedGradient(ans, d.m)) return { status: 'rounded', msg: ROUNDED_MSG };
        return { status: 'ok' };
      },
      check() {
        const okM = qeq(ans.m, d.m), okC = qeq(ans.c, d.c);
        markInput(f.m, okM); markInput(f.c, okC);
        return { correct: okM && okC, msg: lineMsg(L.diagnose(ans.m, ans.c, d.m, d.c), true) };
      },
      async play(res) {
        reveal();
        g.clearLayer('scratch');
        if (res.correct) { g.line(qval(d.m), qval(d.c)); await rideTrue(g, d.m, d.c, this_.gates); return; }
        await rideStudent(g, ans.m, ans.c, this_.gates);
      },
      hint(level) {
        if (level === 1) return 'Find the gradient first: how far <b>across</b> and how far <b>up or down</b> is it from A to B?';
        reveal();
        g.triangle(A, B);
        return `With A = (x₁, y₁) and B = (x₂, y₂): m = (y₂ − y₁) ÷ (x₂ − x₁) = (${fmt(B.y)} − ${paren(A.y)}) ÷ (${fmt(B.x)} − ${paren(A.x)}) = ${fmt(rise)} ÷ ${run} = <b>${qpretty(d.m)}</b>.`;
      },
      solve() {
        reveal();
        g.line(qval(d.m), qval(d.c), { cls: 'ghost-line' });
        g.clearLayer('guides');
        g.triangle(A, B);
        const mistake = eqMistake(ans, d);
        f.m.value = qInput(d.m);
        f.c.value = fmt(d.c.n);
        markInput(f.m, true); markInput(f.c, true);
        const mx = A.y - d.c.n;
        return mistake + stepList([
          ...countSteps(A, B),
          `<b>Find c.</b> Put Gate A ${pt(A)} into y = mx + c: ${fmt(A.y)} = ${qpretty(d.m)} × ${paren(A.x)} + c. That is ${fmt(A.y)} = ${fmt(mx)} + c, so c = ${fmt(A.y)} − ${paren(mx)} = <b>${fmt(d.c.n)}</b>.`,
          `<b>Write the equation.</b> Put m and c into y = mx + c: ${eq(eqStr(d.m, d.c))}`,
          checkStep(d, B)
        ]);
      },
      lock(on) { f.lock(on); }
    };
    return this_;
  }

  // Double Black: the trap table where x goes up in 2s.
  function qTrap(d) {
    const { xs, ys } = d;
    let g, panel, tw, dInp, mInp, vals;
    return {
      key: 'trap' + ys.join(','),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say('Careful: check how <b>x</b> goes up in this table. Find the 1st common difference and the gradient <b>m</b>.');
        tw = tableWidget(panel.work, { xs, ys, diffs: 'show' });
        dInp = numField(panel.work, '1st common difference =', '', '1st common difference');
        mInp = numField(panel.work, 'gradient m =', '', 'gradient m');
      },
      read() { const r = readNums([dInp, mInp], 'Fill in both boxes.'); if (r.vals) vals = r.vals; return r; },
      check() {
        const okD = qeq(vals[0], Q(d.d)), okM = qeq(vals[1], d.m);
        this.okD = okD;
        markInput(dInp, okD); markInput(mInp, okM);
        return { correct: okD && okM, msg: !okD ? 'Check the difference between the y values.' : 'The difference is right, but m is not. How far does x go each step?' };
      },
      async play(res) {
        g.clearLayer('scratch'); g.clearLayer('marks');
        const gates = gateFlags(g, xs.map((x, i) => ({ x, y: ys[i] })));
        if (res.correct) { g.line(d.m.n, d.c.n); await rideTrue(g, d.m, d.c, gates); return; }
        // With a wrong difference, ride the slope that difference gives (difference ÷ 2), so the ride shows it.
        await rideStudent(g, this.okD ? vals[1] : L.qdiv(vals[0], Q(2)), d.c, gates);
      },
      hint(level) {
        if (level === 1) return 'Look at the <b>x</b> row. How much does x go up by each step?';
        tw.showDiff(0, sd(d.d), 'hint');
        return `x goes up by <b>2</b> each step and y goes ${d.d > 0 ? 'up' : 'down'} by <b>${Math.abs(d.d)}</b>. Gradient is rise ÷ run, so m = ${fmt(d.d)} ÷ 2.`;
      },
      solve() {
        L.diffsOf(ys).forEach((v, i) => tw.showDiff(i, sd(v)));
        dInp.value = fmt(d.d); mInp.value = fmt(d.m.n);
        markInput(dInp, true); markInput(mInp, true);
        return `The difference is ${fmt(d.d)}, but each step is 2 across. So m = ${fmt(d.d)} ÷ 2 = <b>${fmt(d.m.n)}</b>.`;
      },
      lock(on) { dInp.disabled = on; mInp.disabled = on; }
    };
  }

  // Triple Diamond: the Lesson 7 worksheet. Y-intercept, positive or negative, rise ÷ run, then y = mx + c.
  function qReport(d) {
    const { gates: gts } = d;
    const base = gts.find(p => p.x === 0), next = gts.find(p => p.x > 0);
    let g, panel, cInp, riseInp, runInp, mInp, f, signBtns, sign = null, vals, eqAns;
    return {
      key: 'report' + qpretty(d.m) + ',' + d.c.n,
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say('Fill in the <b>worksheet</b> for this run, top to bottom. Use the flags to count the rise and run.');
        g.line(qval(d.m), qval(d.c));
        this.gates = gateFlags(g, gts);
        g.idleOnLine(qval(d.m), qval(d.c), -5.3);
        const w = panel.work;
        w.classList.add('report-q');
        cInp = numField(w, 'Y-intercept =', '', 'y-intercept');
        const row = w.appendChild(h('<div class="numrow sign-row" role="group" aria-label="Is the slope positive or negative?"><span class="pre">Slope is</span><span class="verdict"><button type="button" class="toggle" data-v="1">Positive</button><button type="button" class="toggle" data-v="-1">Negative</button></span></div>'));
        signBtns = [...row.querySelectorAll('.toggle')];
        signBtns.forEach(b => {
          b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', () => {
            sign = +b.dataset.v;
            signBtns.forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.classList.remove('ok', 'bad'); });
          });
        });
        riseInp = numField(w, 'rise =', '', 'rise');
        runInp = numField(w, 'run =', '', 'run');
        mInp = numField(w, 'Slope m =', '', 'slope m, rise divided by run');
        [cInp, riseInp, runInp, mInp].forEach(i => i.closest('.numrow').classList.add('aligned'));
        w.appendChild(h('<p class="tip">Slope = rate of change = rise ÷ run. Count the rise up (+) or down (−), and the run across.</p>'));
        f = eqField(w);
        setTimeout(() => cInp.focus({ preventScroll: true }), 80);
      },
      read() {
        const r = readNums([cInp, riseInp, runInp, mInp], 'Fill in every box: y-intercept, rise, run and m.', [null, null, null, d.m]);
        if (r.status !== 'ok') return r;
        if (!sign) return { status: 'empty', msg: 'Choose whether the slope is <b>Positive</b> or <b>Negative</b>.' };
        if (r.vals[2].n === 0) return { status: 'invalid', msg: 'The run can’t be 0. Count how far across you go between two flags.' };
        if (!f.m.value.trim() || !f.c.value.trim()) return { status: 'empty', msg: 'Fill in both boxes in y = mx + c. If there is no number on the end, type 0.' };
        eqAns = L.parseEq(f.m.value, f.c.value);
        if (eqAns.status === 'invalid') return { status: 'invalid', msg: eqAns.mixed ? MIXED_MSG : INVALID_MSG };
        if (L.roundedGradient(eqAns, d.m)) return { status: 'rounded', msg: ROUNDED_MSG };
        vals = r.vals;
        return r;
      },
      check() {
        const [c, rise, run, m] = vals;
        const okC = qeq(c, d.c), okSign = sign === L.qsign(d.m), okRR = qeq(L.qdiv(rise, run), d.m), okM = qeq(m, d.m);
        const okEq = qeq(eqAns.m, d.m) && qeq(eqAns.c, d.c);
        markInput(cInp, okC); markInput(riseInp, okRR); markInput(runInp, okRR); markInput(mInp, okM);
        markInput(f.m, qeq(eqAns.m, d.m)); markInput(f.c, qeq(eqAns.c, d.c));
        signBtns.forEach(b => { b.classList.remove('ok', 'bad'); if (+b.dataset.v === sign) b.classList.add(okSign ? 'ok' : 'bad'); });
        const msg = [];
        if (!okC) msg.push('Y-intercept: where does the run cross the y-axis?');
        if (!okSign) msg.push('Read the run left to right: uphill is positive, downhill is negative.');
        if (!okRR) msg.push('Check the rise and run: from one flag to the next, count across, then up (+) or down (−).');
        if (!okM) msg.push(okRR ? 'Now divide: m = rise ÷ run.' : slopeMsg(m, d.m));
        if (!okEq) msg.push(okM && okC ? 'Copy your m and y-intercept into y = mx + c.' : lineMsg(L.diagnose(eqAns.m, eqAns.c, d.m, d.c)));
        // Worksheet order: point at the first wrong part, top to bottom.
        const more = msg.length > 1 ? ` Then check the other boxes marked red.` : '';
        return { correct: okC && okSign && okRR && okM && okEq, msg: (msg[0] || '') + more };
      },
      async play(res) {
        g.clearLayer('scratch');
        if (res.correct) { await rideTrue(g, d.m, d.c, this.gates); return; }
        if (eqAns.m.n !== 0 && L.qsign(eqAns.m) !== L.qsign(d.m)) g.arrowFlash();
        await rideStudent(g, eqAns.m, eqAns.c, this.gates);
      },
      hint(level) {
        if (level === 1) return 'Start at the top. The <b>y-intercept</b> is where the run crosses the y-axis. Then read the run <b>left to right</b>: uphill means a positive slope, downhill means negative.';
        g.station(base, 'Y-INTERCEPT', { cls: 'cyan', layer: 'guides' });
        g.triangle(base, next);
        return `Y-intercept = ${fmt(d.c.n)}. From ${pt(base)} to ${pt(next)}: run ${next.x - base.x}, rise ${fmt(next.y - base.y)}. Slope = rise ÷ run.`;
      },
      solve() {
        g.clearLayer('guides');
        g.station(base, 'Y-INTERCEPT', { cls: 'cyan', layer: 'guides' });
        g.triangle(base, next);
        const mistake = eqMistake(eqAns, d);
        const rise = next.y - base.y, run = next.x - base.x;
        cInp.value = fmt(d.c.n); riseInp.value = fmt(rise); runInp.value = fmt(run); mInp.value = qInput(d.m);
        f.m.value = qInput(d.m); f.c.value = fmt(d.c.n);
        [cInp, riseInp, runInp, mInp, f.m, f.c].forEach(i => markInput(i, true));
        signBtns.forEach(b => { const on = +b.dataset.v === L.qsign(d.m); b.setAttribute('aria-pressed', String(on)); b.classList.remove('ok', 'bad'); if (on) b.classList.add('ok'); });
        const up = d.m.n > 0;
        return mistake + stepList([
          `<b>Y-intercept.</b> The run crosses the y-axis at ${pt(base)}, so the <b>y-intercept = ${fmt(d.c.n)}</b>.`,
          `<b>Positive or negative?</b> Reading left to right, the run goes <b>${up ? 'uphill' : 'downhill'}</b>, so the slope is <b>${up ? 'positive' : 'negative'}</b>.`,
          ...countSteps(base, next),
          `<b>Write the equation.</b> Put m and the y-intercept into y = mx + c: ${eq(eqStr(d.m, d.c))}`,
          checkStep(d, next)
        ]);
      },
      lock(on) {
        [cInp, riseInp, runInp, mInp].forEach(i => { i.disabled = on; });
        signBtns.forEach(b => { b.disabled = on; });
        f.lock(on);
      }
    };
  }

  // Each maker builds fresh data, then the question. q.data keeps the data for debugging.
  const make = (build, gen) => () => { const d = gen(); const q = build(d); q.data = d; return q; };
  const MAKERS = {
    plot: make(qPlot, () => L.genPlot()),
    plotHard: make(qPlot, () => L.genPlot({ hard: true, n: 5 })),
    fill: make(qFill, () => L.genTable()),
    read: make(qRead, () => L.genTable({ withZero: true })),
    straight: make(qStraight, () => L.genStraight()),
    tapY: make(qBlue, () => L.genBlue('tapY')),
    tapX: make(qBlue, () => L.genBlue('tapX')),
    xToY: make(qBlue, () => L.genBlue('xToY')),
    yToX: make(qBlue, () => L.genBlue('yToX')),
    grad: make(d => qGradient(d, { parts: true }), () => L.genReadGradient()),
    gradWide: make(d => qGradient(d, { parts: true }), () => L.genReadGradient({ wide: true })),
    build: make(qBuild, () => L.genBuildRun()),
    frac: make(d => qGradient(d, { parts: true }), () => L.genFracGradient()),
    fracWide: make(d => qGradient(d, { parts: true }), () => L.genFracGradient({ wide: true })),
    eqInt: make(qEquation, () => L.genEquation('int')),
    eqFrac: make(qEquation, () => L.genEquation('frac')),
    twoPoint: make(qTwoPoint, () => L.genTwoPoint()),
    trap: make(qTrap, () => L.genTrap()),
    repUp: make(qReport, () => L.genReport({ sign: 1, frac: false })),
    repDown: make(qReport, () => L.genReport({ sign: -1, frac: false })),
    repFracUp: make(qReport, () => L.genReport({ sign: 1, frac: true })),
    repFracDown: make(qReport, () => L.genReport({ sign: -1, frac: true })),
    rep: make(qReport, () => L.genReport())
  };
  const anyOf = list => list[Math.floor(Math.random() * list.length)];
  // Question order by streak, so every type comes up on the way to 5 in a row.
  const orderBy = seq => streak => { const s = seq[Math.min(streak, seq.length - 1)]; return Array.isArray(s) ? anyOf(s) : s; };

  // =====================================================================
  // ? help: a worked example, one step at a time, plotted on a small graph (never the student's own numbers)
  // =====================================================================
  // Step fields: say, work, col (highlight), y: [i, v] (fill a cell), walk: [x, y] (dot walks across then up),
  // points (plot every table point), rise: i (show the change from point i to i + 1), diffs, curve, verdict, mark: [x, y]
  const HELP = {
    fill: {
      title: 'Filling in a table',
      xs: [0, 1, 2, 3], ys: [1, 3, 5, 7], blankY: true, box: [-1, 4, -1, 8],
      steps: [
        { say: 'The rule <span class="eq">y = 2x + 1</span> tells you how to turn each x into y: <b>double x, then add 1</b>.' },
        { col: 0, say: 'First column.', calc: [0, '2 × 0 + 1', 1], y: [0, 1], walk: [0, 1] },
        { col: 1, say: 'Next column.', calc: [1, '2 × 1 + 1', 3], y: [1, 3], walk: [1, 3] },
        { col: 2, say: 'Next column.', calc: [2, '2 × 2 + 1', 5], y: [2, 5], walk: [2, 5] },
        { col: 3, say: 'Last column.', calc: [3, '2 × 3 + 1', 7], y: [3, 7], walk: [3, 7] },
        { say: 'Done! y goes up by <b>2</b> every step, and the points make a straight line. That 2 is the number in front of x.', diffs: ['+2', '+2', '+2'], line: true }
      ]
    },
    read: {
      title: 'Reading a table',
      xs: [-1, 0, 1, 2], ys: [-4, -1, 2, 5], box: [-2, 3, -5, 6],
      steps: [
        { say: 'You need two things: the <b>1st common difference</b> and <b>y when x = 0</b>. Here are the table’s points on the graph.', points: true },
        { say: 'Subtract each y from the <b>next</b> one. On the graph that is how far you go up between dots.', work: '−1 − (−4) = <b>3</b>', diff: [0, '+3'], rise: 0 },
        { say: 'Next pair.', work: '2 − (−1) = <b>3</b>', diff: [1, '+3'], rise: 1 },
        { say: 'Last pair.', work: '5 − 2 = <b>3</b>', diff: [2, '+3'], rise: 2 },
        { say: 'Up 3 every time, so the <b>1st common difference = 3</b>.' },
        { col: 1, say: 'Now find <b>x = 0</b> in the top row and read the y underneath it: <b>y = −1</b>. It is where the line crosses the y-axis.', mark: [0, -1] }
      ]
    },
    straight: {
      title: 'Is it a straight run?',
      xs: [0, 1, 2, 3], ys: [1, 2, 5, 10], box: [-1, 4, -1, 11],
      steps: [
        { say: 'Work out how much y changes from each column to the next. Here are the points.', points: true },
        { say: 'First pair.', work: '2 − 1 = <b>1</b>', diff: [0, '+1'], rise: 0 },
        { say: 'Next pair.', work: '5 − 2 = <b>3</b>', diff: [1, '+3'], rise: 1 },
        { say: 'Last pair.', work: '10 − 5 = <b>5</b>', diff: [2, '+5'], rise: 2 },
        { say: 'The differences are 1, 3, 5. They <b>change</b>, so the dots bend into a curve: <b>not straight</b>.', verdict: 'Not straight', curve: true },
        { say: 'If every difference had been the same, the dots would sit on a <b>straight run</b>.' }
      ]
    }
  };

  // A small graph for the help card.
  function helpGraph(parent, box) {
    const [x0, x1, y0, y1] = box, U = 24, pad = 16;
    const W = (x1 - x0) * U + pad * 2, Hh = (y1 - y0) * U + pad * 2;
    const X = x => pad + (x - x0) * U, Y = y => pad + (y1 - y) * U;
    const { svgEl } = window.SRFX;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${Hh}`, class: 'help-graph', role: 'img', 'aria-label': 'Example graph' });
    parent.appendChild(svg);
    let d = '';
    for (let x = x0; x <= x1; x++) d += `M${X(x)} ${Y(y0)}V${Y(y1)}`;
    for (let y = y0; y <= y1; y++) d += `M${X(x0)} ${Y(y)}H${X(x1)}`;
    svgEl('path', { d, class: 'gridlines' }, svg);
    svgEl('path', { d: `M${X(x0)} ${Y(0)}H${X(x1)}M${X(0)} ${Y(y0)}V${Y(y1)}`, class: 'axis' }, svg);
    const t = svgEl('g', { class: 'ticks' }, svg);
    for (let x = x0; x <= x1; x++) if (x) svgEl('text', { x: X(x), y: Y(0) + 14, 'text-anchor': 'middle' }, t).textContent = fmt(x);
    for (let y = y0; y <= y1; y++) if (y) svgEl('text', { x: X(0) - 5, y: Y(y) + 4, 'text-anchor': 'end' }, t).textContent = fmt(y);
    const layer = svgEl('g', null, svg);
    return {
      clear() { layer.innerHTML = ''; },
      dot(x, y, cls) { return svgEl('circle', { cx: X(x), cy: Y(y), r: 6, class: 'help-dot ' + (cls || '') }, layer); },
      line(pts, cls) { return svgEl('polyline', { points: pts.map(p => X(p.x) + ',' + Y(p.y)).join(' '), class: cls, fill: 'none' }, layer); },
      label(x, y, text, cls) { const e = svgEl('text', { x: X(x), y: Y(y), class: 'glabel ' + (cls || '') }, layer); e.textContent = text; return e; },
      X, Y
    };
  }

  function showHelp(key, start) {
    const H = HELP[key];
    if (!H) return;
    document.querySelectorAll('.help-overlay').forEach(o => o.remove());
    const ov = document.body.appendChild(h(`
      <div class="overlay help-overlay" role="dialog" aria-modal="true" aria-label="${esc(H.title)}">
        <div class="help-card">
          <div class="help-top"><h2 class="outline">${H.title}</h2><button class="help-close" type="button" aria-label="Close">✕</button></div>
          <p class="help-note">Example only, with different numbers from your question.</p>
          <div class="help-body">
            <div class="help-graph-wrap"></div>
            <div class="help-side">
              <div class="help-table"></div>
              <p class="help-say" aria-live="polite"></p>
              <div class="help-work"></div>
              <div class="help-count"></div>
            </div>
          </div>
          <div class="help-foot">
            <span class="help-step"></span>
            <div class="help-actions">
              <button class="btn small secondary" type="button" data-v="back">◀ Back</button>
              <button class="btn small" type="button" data-v="next">Next ▶</button>
            </div>
          </div>
        </div>
      </div>`));
    const tw = tableWidget(ov.querySelector('.help-table'), { xs: H.xs, ys: H.ys, diffs: 'show' });
    const gr = helpGraph(ov.querySelector('.help-graph-wrap'), H.box);
    const sayEl = ov.querySelector('.help-say'), workEl = ov.querySelector('.help-work'), countEl = ov.querySelector('.help-count');
    const stepEl = ov.querySelector('.help-step'), backBtn = ov.querySelector('[data-v=back]'), nextBtn = ov.querySelector('[data-v=next]');
    const yCells = [...ov.querySelectorAll('.help-table .cell.yc')];
    const pts = H.xs.map((x, i) => ({ x, y: H.ys[i] }));
    let k = 0, run = 0;
    const pause = ms => new Promise(r => setTimeout(r, ms));

    // Walk a dot from (0, 0) across to x, then up (or down) to y, one square at a time.
    async function walk(x, y, token, instant) {
      if (instant) { gr.dot(x, y, 'placed'); return; }
      const path = [{ x: 0, y: 0 }];
      const walker = gr.dot(0, 0, 'walker');
      const trail = gr.line(path, 'help-trail');
      const place = p => {
        walker.setAttribute('cx', gr.X(p.x)); walker.setAttribute('cy', gr.Y(p.y));
        path.push(p); trail.setAttribute('points', path.map(q => gr.X(q.x) + ',' + gr.Y(q.y)).join(' '));
      };
      await pause(500);
      let cx = 0, cy = 0;
      for (let i = 1; i <= Math.abs(x); i++) {
        if (token !== run) return;
        cx += Math.sign(x); place({ x: cx, y: 0 });
        countEl.innerHTML = `${x > 0 ? 'Right' : 'Left'} <b>${i}</b>${i === Math.abs(x) ? ` (x = ${fmt(x)})` : ''}`;
        await pause(550);
      }
      const across = x ? `${x > 0 ? 'Right' : 'Left'} ${Math.abs(x)}, then ` : '';
      for (let i = 1; i <= Math.abs(y); i++) {
        if (token !== run) return;
        cy += Math.sign(y); place({ x: cx, y: cy });
        countEl.innerHTML = `${across}${across ? (y > 0 ? 'up' : 'down') : (y > 0 ? 'Up' : 'Down')} <b>${i}</b>${i === Math.abs(y) ? ` (y = ${fmt(y)})` : ''}`;
        await pause(550);
      }
      if (token !== run) return;
      walker.setAttribute('class', 'help-dot placed');
      countEl.innerHTML += ' ✓ plotted';
    }
    // Show the rise between point i and i + 1, growing one square at a time.
    async function rise(i, token, instant) {
      const a = pts[i], b = pts[i + 1], up = b.y - a.y;
      gr.line([a, { x: b.x, y: a.y }], 'help-run');
      const seg = gr.line([{ x: b.x, y: a.y }, { x: b.x, y: a.y }], 'help-rise');
      const lab = gr.label(b.x + 0.15, (a.y + b.y) / 2, '', 'help-rise-label');
      for (let s = instant ? Math.abs(up) : 1; s <= Math.abs(up); s++) {
        if (token !== run) return;
        const yy = a.y + Math.sign(up) * s;
        seg.setAttribute('points', `${gr.X(b.x)},${gr.Y(a.y)} ${gr.X(b.x)},${gr.Y(yy)}`);
        lab.textContent = sd(Math.sign(up) * s);
        if (!instant) { countEl.innerHTML = `Up <b>${s}</b>`; await pause(550); }
      }
    }

    function reset() {
      if (H.blankY) yCells.forEach(c => { c.textContent = ''; c.classList.remove('pop'); });
      ov.querySelectorAll('.help-table .cell.dc').forEach(c => { c.innerHTML = ''; });
      H.xs.forEach((x, i) => tw.colState(i, null));
      ov.querySelector('.help-verdict')?.remove();
      gr.clear();
      sayEl.innerHTML = ''; workEl.innerHTML = ''; countEl.innerHTML = '';
    }
    // Apply one step. Earlier steps are applied instantly; the current one animates.
    // Start with x → use the rule → find y, one line at a time.
    async function calc(st, token, instant) {
      const [x, sum, y] = st.calc;
      const rows = [
        `<span class="calc-k">1. Start with</span><span class="calc-v"><b>x = ${fmt(x)}</b></span>`,
        `<span class="calc-k">2. Rule</span><span class="calc-v">y = 2x + 1 → y = ${sum}</span>`,
        `<span class="calc-k">3. Find y</span><span class="calc-v"><b>y = ${fmt(y)}</b></span>`
      ];
      workEl.innerHTML = '<div class="help-calc"></div>';
      const box = workEl.firstChild;
      for (const r of rows) {
        if (token !== run) return;
        box.insertAdjacentHTML('beforeend', `<div class="calc-row">${r}</div>`);
        if (!instant) await pause(900);
      }
    }
    async function apply(st, token, instant) {
      if (st.calc && !instant) await calc(st, token, false);
      if (token !== run) return;
      if (st.points) pts.forEach(p => gr.dot(p.x, p.y, 'placed'));
      if (st.y) { const c = yCells[st.y[0]]; c.textContent = fmt(st.y[1]); if (!instant) c.classList.add('pop'); }
      if (st.diff) tw.showDiff(st.diff[0], st.diff[1]);
      if (st.diffs) st.diffs.forEach((t2, i) => tw.showDiff(i, t2));
      if (st.verdict && !ov.querySelector('.help-verdict')) workEl.insertAdjacentHTML('afterend', `<p class="help-verdict"><span class="toggle" aria-pressed="true">${st.verdict}</span></p>`);
      if (st.line) gr.line([{ x: -1, y: -1 }, { x: 3.5, y: 8 }], 'help-line');
      if (st.curve) gr.line(Array.from({ length: 31 }, (_, j) => { const x = -0.4 + j * 0.13; return { x, y: x * x + 1 }; }).filter(p => p.y <= 11), 'help-curve');
      if (st.mark) gr.dot(st.mark[0], st.mark[1], 'mark');
      if (st.walk) await walk(st.walk[0], st.walk[1], token, instant);
      if (st.rise != null) await rise(st.rise, token, instant);
    }
    async function show(n) {
      k = n;
      const token = ++run;
      reset();
      for (let i = 0; i < k; i++) await apply(H.steps[i], token, true);
      const st = H.steps[k];
      H.xs.forEach((x, i) => tw.colState(i, st.col === i ? 'hl' : null));
      sayEl.innerHTML = st.say || '';
      workEl.innerHTML = st.work || '';
      if (st.calc && REDUCED) await calc(st, token, true);
      stepEl.textContent = `Step ${k + 1} of ${H.steps.length}`;
      backBtn.disabled = k === 0;
      nextBtn.textContent = k === H.steps.length - 1 ? 'Got it ✓' : 'Next ▶';
      await apply(st, token, REDUCED);
    }
    const close = () => { run++; ov.remove(); };
    ov.querySelector('.help-close').addEventListener('click', close);
    backBtn.addEventListener('click', () => { if (k > 0) show(k - 1); });
    nextBtn.addEventListener('click', () => { if (k < H.steps.length - 1) show(k + 1); else close(); });
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    setTimeout(() => nextBtn.focus({ preventScroll: true }), 60);
    show(Math.min(start || 0, H.steps.length - 1));
  }

  // =====================================================================
  // Explore scripts
  // =====================================================================
  function makeEx(ctx) {
    const { panel, session } = ctx;
    const ex = {
      step(i, n) { panel.setMeta(`Step ${i} of ${n}`); panel.feedback(''); panel.clearActions(); },
      say: html => panel.say(html),
      feedback: (html, k) => panel.feedback(html, k),
      clearWork() { panel.work.innerHTML = ''; },
      task: p => session.wait(p),
      async watch(p) { panel.feedback('Watch the rider…', 'info'); await session.wait(p); panel.feedback(''); },
      async ok(html, label) {
        if (html) panel.feedback(html, 'good');
        await panel.waitButton(label || 'Next ▶');
        panel.feedback('');
        panel.clearActions();
      },
      async choice(question, options, correct, success, onCorrect) {
        const box = panel.work.appendChild(h(`<div class="choice"><p class="q">${question}</p><div class="opts"></div></div>`));
        panel.clearActions();
        await session.wait(new Promise(res => {
          options.forEach((o, i) => {
            const b = box.querySelector('.opts').appendChild(h(`<button class="opt" type="button">${o}</button>`));
            b.addEventListener('click', () => {
              if (i === correct) {
                b.classList.add('ok');
                box.querySelectorAll('.opt').forEach(x => { x.disabled = true; });
                panel.feedback('');
                res();
              } else {
                b.classList.add('bad');
                b.disabled = true;
                panel.feedback('Not quite. Look again and have another go.', 'bad');
              }
            });
          });
        }));
        if (onCorrect) await session.wait(onCorrect());
        await ex.ok(success);
        box.remove();
      },
      async input(question, expected, success, pre, hint) {
        const box = panel.work.appendChild(h(`<div class="choice"><p class="q">${question}</p></div>`));
        const inp = numField(box, pre || '', '', pre || 'answer');
        panel.clearActions();
        const btn = panel.button('Check ✓');
        setTimeout(() => inp.focus({ preventScroll: true }), 80);
        await session.wait(new Promise(res => {
          const go = () => {
            const r = L.judgeNum(inp.value, expected);
            if (r.status === 'correct') { markInput(inp, true); inp.disabled = true; btn.disabled = true; panel.feedback(''); res(); }
            else if (r.status === 'empty') panel.feedback('Type your answer first.', 'info');
            else if (r.status === 'invalid') panel.feedback(r.mixed ? MIXED_MSG : INVALID_MSG, 'info');
            else if (r.status === 'rounded') panel.feedback(ROUNDED_MSG, 'info');
            else { markInput(inp, false); panel.feedback('Not quite. ' + (hint || 'Try again.'), 'bad'); btn.scrollIntoView({ block: 'nearest' }); }
          };
          btn.addEventListener('click', go);
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
        }));
        await ex.ok(success);
        box.remove();
      }
    };
    return ex;
  }

  // A slope you change by dragging B. Anchor A is fixed.
  function slopeRig(ctx, A, B0) {
    const { g, panel } = ctx;
    let B = { ...B0 }, lineEl = null, tri = null;
    const watchers = [];
    const readout = panel.work.appendChild(h('<div class="readout"></div>'));
    g.dot(A.x, A.y, { cls: 'anchor', r: 8 });
    const mOf = () => Q(B.y - A.y, B.x - A.x);
    const draw = () => {
      const m = mOf(), mv = qval(m), cv = A.y - mv * A.x;
      if (lineEl) lineEl.remove();
      if (tri) tri.remove();
      lineEl = g.line(mv, cv);
      tri = g.triangle(A, B);
      g.idleOnLine(mv, cv, A.x - 1.5);
      readout.innerHTML = `rise <b>${fmt(B.y - A.y)}</b> · run <b>${fmt(B.x - A.x)}</b> · m = rise ÷ run = <b>${qpretty(m)}</b>`;
      watchers.slice().forEach(f => f(m, B));
    };
    const handle = g.handle(B, { constrain: q => ({ x: Math.max(q.x, A.x + 1), y: q.y }), onMove: p => { B = p; draw(); }, label: 'Slope handle' });
    draw();
    return {
      until(cond) {
        return new Promise(res => {
          // Check right away too: the handle may already be in place from an earlier step.
          if (cond(mOf(), B)) { res(); return; }
          const f = (m, b) => { if (cond(m, b)) { watchers.splice(watchers.indexOf(f), 1); res(); } };
          watchers.push(f);
        });
      },
      ride() { const mv = qval(mOf()); return g.ride(L.clipLine(mv, A.y - mv * A.x)); },
      lock() { handle.locked = true; handle.g.classList.add('locked'); },
      unlock() { handle.locked = false; handle.g.classList.remove('locked'); }
    };
  }

  // Base Station handle (sets c) plus a slope handle (sets m).
  function eqRig(ctx) {
    const { g, panel } = ctx;
    let base = { x: 0, y: 0 }, off = { x: 1, y: 1 }, lineEl = null, tri = null;
    const watchers = [];
    const readout = panel.work.appendChild(h('<div class="readout big"></div>'));
    const draw = () => {
      const m = Q(off.y, off.x), mv = qval(m);
      if (lineEl) lineEl.remove();
      if (tri) tri.remove();
      lineEl = g.line(mv, base.y);
      tri = g.triangle(base, { x: base.x + off.x, y: base.y + off.y });
      g.idleOnLine(mv, base.y, -5.5);
      readout.innerHTML = `${eqStr(m, Q(base.y))}<span class="readout-sub">m = ${qpretty(m)} · c = ${fmt(base.y)}</span>`;
      watchers.slice().forEach(f => f(m, base.y));
    };
    const slopeH = g.handle({ x: off.x, y: off.y }, {
      constrain: q => ({ x: Math.max(1, q.x), y: q.y }),
      onMove: p => { off = { x: p.x - base.x, y: p.y - base.y }; draw(); },
      label: 'Slope handle'
    });
    g.handle(base, {
      cls: 'base',
      constrain: q => ({ x: 0, y: q.y }),
      onMove: p => {
        base = p;
        slopeH.set({ x: off.x, y: Math.max(-10, Math.min(10, base.y + off.y)) });
        draw();
      },
      label: 'Base Station handle'
    });
    draw();
    return {
      until(cond) {
        return new Promise(res => {
          if (cond(Q(off.y, off.x), base.y)) { res(); return; }
          const f = (m, c) => { if (cond(m, c)) { watchers.splice(watchers.indexOf(f), 1); res(); } };
          watchers.push(f);
        });
      },
      ride() { const mv = off.y / off.x; return g.ride(L.clipLine(mv, base.y)); },
      lock() { g.lockHandles(true); },
      unlock() { g.lockHandles(false); }
    };
  }

  async function exploreBunny(ctx) {
    const { g, ex, panel } = ctx;
    ex.step(1, 2);
    ex.say('Every pair in a table is a point on the mountain. <b>x</b> is how far <b>across</b>, <b>y</b> is how far <b>up or down</b>. Tap the grid to plant a flag for each pair.');
    const xs = [-2, -1, 0, 1, 2], pts = xs.map(x => ({ x, y: x + 1 }));
    const tw = tableWidget(panel.work, { xs, ys: pts.map(p => p.y) });
    const done = new Set();
    await ex.task(new Promise(res => {
      g.setTap(p => {
        const i = pts.findIndex(q => q.x === p.x && q.y === p.y);
        if (i >= 0) {
          if (done.has(i)) return;
          done.add(i);
          g.flag(p.x, p.y, 'ok');
          tw.colState(i, 'ok');
          const left = pts.length - done.size;
          ex.feedback(left ? `Flag planted at ${pt(p)}. ${left} to go.` : 'All five flags are down!', 'good');
          if (!left) { g.setTap(null); res(); }
        } else {
          g.dropFlag(g.flag(p.x, p.y, 'bad'));
          ex.feedback(`${pt(p)} isn't in the table. Find x first (across), then y (up or down).`, 'bad');
        }
      }, { coords: true });
    }));
    g.line(1, 1);
    await ex.watch(g.ride(L.clipLine(1, 1), { gates: pts }));
    await ex.ok('The rider joined your flags into one run.');
    ex.step(2, 2);
    ex.say('Look at the run the rider made through your flags.');
    await ex.choice('What shape do your flags make?', ['A straight line', 'A curve', 'A zig-zag'], 0,
      `Yes! A table from a rule like ${eq('y = x + 1')} always makes a straight line. That is why these are called <b>linear</b> graphs.`);
  }

  async function exploreGreen(ctx) {
    const { g, ex, panel } = ctx;
    const xs = [-1, 0, 1, 2, 3];
    const runs = [{ name: 'Run A', m: 2, c: 1, color: '#3DF58B', cls: 'a' }, { name: 'Run B', m: 3, c: 0, color: '#19E3FF', cls: 'b' }];
    ex.step(1, 6);
    ex.say('Each run has a <b>rule</b> that turns x into y. Run A: double x, then add 1. Run B: multiply x by 3. Fill in <b>y</b> in both tables and watch how much y goes up each step.');
    panel.setHelp('fill');
    const tws = runs.map(r => {
      const wrap = panel.work.appendChild(h(`<div class="tbl-wrap ${r.cls}"><p class="tbl-title">${r.name}: rule ${eq(eqStr(Q(r.m), Q(r.c)))} <span class="rule-words">(${ruleWords(r.m, r.c)})</span></p></div>`));
      return tableWidget(wrap, { xs, ys: xs.map(x => r.m * x + r.c), editY: true, diffs: 'show', label: r.name });
    });
    const okCells = runs.map(() => new Set());
    await ex.task(new Promise(res => {
      runs.forEach((r, k) => {
        tws[k].yInputs.forEach((inp, i) => {
          const want = r.m * xs[i] + r.c;
          const test = final => {
            const p = L.parseNum(inp.value);
            if (p.ok && qeq(p.q, Q(want))) {
              if (okCells[k].has(i)) return true;
              okCells[k].add(i);
              markInput(inp, true);
              inp.readOnly = true;
              g.dot(xs[i], want, { cls: 'plot-dot ' + r.cls, r: 6 });
              for (const j of [i - 1, i]) {
                if (j >= 0 && j < xs.length - 1 && okCells[k].has(j) && okCells[k].has(j + 1)) tws[k].showDiff(j, '+' + r.m);
              }
              if (okCells[0].size + okCells[1].size === xs.length * 2) { ex.feedback(''); res(); }
              return true;
            } else if (final && !p.empty) {
              markInput(inp, false);
              ex.feedback(`Check ${r.name} at x = ${fmt(xs[i])}: y = ${r.m} × ${paren(xs[i])}${sgn(r.c)}.`, 'bad');
            }
          };
          inp.addEventListener('input', () => test(false));
          inp.addEventListener('change', () => test(true));
          inp.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            if (!test(true) && !inp.readOnly) return;
            const all = [...tws[0].yInputs, ...tws[1].yInputs];
            const next = all.slice(all.indexOf(inp) + 1).find(x => !x.readOnly) || all.find(x => !x.readOnly);
            if (next) { next.focus({ preventScroll: true }); next.scrollIntoView({ block: 'nearest' }); }
          });
        });
      });
      setTimeout(() => tws[0].yInputs[0].focus({ preventScroll: true }), 80);
    }));
    g.line(2, 1, { color: runs[0].color });
    g.line(3, 0, { color: runs[1].color });
    await ex.watch(g.ride(L.clipLine(3, 0)));
    await ex.ok('Both tables done. Run B climbs <b>3</b> every step. Run A climbs <b>2</b>.');
    ex.step(2, 6);
    await ex.choice('Which run climbs faster?', ['Run A: y = 2x + 1', 'Run B: y = 3x'], 1, 'Right. Its y values jump by 3 every step, so it is steeper.');
    ex.step(3, 6);
    await ex.choice('Run B goes up by <b>3</b> every step. Where is that 3 in y = 3x?', ['The number in front of x', 'The number on the end', 'It is not in the equation'], 0,
      'Yes! That jump is the <b>1st common difference</b>. It is also the <b>gradient</b>: how fast the run climbs.');
    ex.step(4, 6);
    await ex.input('In Run A, y = 2x + 1. What is y when x = 0?', Q(1), 'Yes. When x = 0, y = 1.', 'y =', 'Put x = 0 into y = 2x + 1: 2 × 0 + 1.');
    ex.step(5, 6);
    await ex.choice('Where is that 1 in y = 2x + 1?', ['The number in front of x', 'The number on the end'], 1,
      'Right. The number on the end tells you where the run crosses the <b>y-axis</b>.');
    ex.step(6, 6);
    ex.clearWork();
    g.clear();
    ex.say(`Not every table makes a straight run. This one is from ${eq('y = x²')}.`);
    const sx = [-2, -1, 0, 1, 2], sy = sx.map(x => x * x), spts = sx.map((x, i) => ({ x, y: sy[i] }));
    const tw = tableWidget(panel.work, { xs: sx, ys: sy, diffs: 'show' });
    L.diffsOf(sy).forEach((v, i) => tw.showDiff(i, sd(v)));
    const flags = gateFlags(g, spts);
    await ex.choice('Is the difference the same every time?', ['Yes', 'No'], 1,
      'Right. The differences change, so it is <b>not</b> a straight run. The rider gets bounced over moguls! Only tables with the same difference every time are <b>linear</b>.',
      async () => { const curve = sample(x => x * x, -2, 2); g.polyline(curve, { cls: 'run-line mogul' }); g.banner('MOGULS!', 'warn'); await g.ride(curve, { gates: flags }); });
  }

  async function exploreBlue(ctx) {
    const { g, ex, panel } = ctx;
    const m = -1, c = 3;
    ex.step(1, 4);
    ex.say('Drag the <b>orange handle</b> to slide the rider along the run. Find the two places where the run crosses an axis.');
    g.line(m, c);
    const readout = panel.work.appendChild(h('<div class="readout"></div>'));
    const seen = new Set();
    let showY = true, last = null;
    let found;
    const allFound = new Promise(r => { found = r; });
    const show = p => {
      last = p;
      g.idleOnLine(m, c, p.x);
      readout.innerHTML = showY ? `Rider at <b>${pt(p)}</b>` : `Rider at <b>x = ${fmt(p.x)}</b>`;
      if (p.x === 0 && !seen.has('y')) { seen.add('y'); g.station(p, 'BASE STATION', { cls: 'cyan' }); ex.feedback('That is the <b>Base Station</b>: the run crosses the y-axis.', 'good'); }
      if (p.y === 0 && !seen.has('x')) { seen.add('x'); g.station(p, 'SNOW LINE', { cls: 'yellow', below: true }); ex.feedback('That is the <b>Snow Line</b>: the run crosses the x-axis.', 'good'); }
      if (seen.size === 2) found();
    };
    const start = { x: -4, y: 7 };
    g.handle(start, { constrain: q => ({ x: q.x, y: m * q.x + c }), onMove: show, label: 'Rider handle. Use left and right arrow keys.' });
    show(start);
    await ex.task(allFound);
    await ex.ok('You found both. The places where a run crosses the axes are its <b>intercepts</b>.');
    ex.step(2, 4);
    ex.say('The <b>Base Station</b> is where the run crosses the y-axis. The <b>Snow Line</b> is where it crosses the x-axis.');
    await ex.choice('What is always true at the Base Station?', ['x = 0', 'y = 0', 'x = y'], 0,
      'Yes. The Base Station sits on the y-axis, so x = 0. Its y value is the <b>y-intercept</b>.');
    ex.step(3, 4);
    await ex.choice('And at the Snow Line?', ['x = 0', 'y = 0'], 1,
      'Right. The Snow Line sits on the x-axis, so y = 0. Its x value is the <b>x-intercept</b>.');
    ex.step(4, 4);
    showY = false;
    show(last);
    ex.say('Now read the mountain yourself. The readout only shows x this time.');
    await ex.input('Slide the rider to x = −2. What is y there?', Q(5), 'Yes. Go across to x = −2, then up to the run: y = 5.', 'y =',
      'Find x = −2 on the x-axis, go up to the run, then read across to the y-axis.');
  }

  async function exploreRed(ctx) {
    const { ex } = ctx;
    const A = { x: -2, y: -2 };
    ex.step(1, 5);
    ex.say('Drag the <b>orange handle</b> to change the slope. The rider always reads the run from <b>left to right</b>. Make the run go <b>downhill</b>.');
    const rig = slopeRig(ctx, A, { x: 1, y: 1 });
    await ex.task(rig.until(m => m.n < 0));
    rig.lock();
    await ex.choice('Downhill! What happened to m?', ['It became negative', 'It got bigger', 'It stayed the same'], 0,
      'Yes. Downhill, reading left to right, means a <b>negative</b> gradient.');
    ex.step(2, 5);
    ex.say('Now make the run <b>flat</b>.');
    rig.unlock();
    await ex.task(rig.until(m => m.n === 0));
    rig.lock();
    await ex.choice('What is m for a flat track?', ['0', '1', 'There is no m'], 0, 'Right. No rise at all, so m = 0.');
    ex.step(3, 5);
    ex.say('Make it an uphill lift that is <b>steeper than m = 2</b>.');
    rig.unlock();
    await ex.task(rig.until(m => qval(m) > 2));
    rig.lock();
    await ex.choice('A steeper run has...', ['A bigger m (further from 0)', 'A smaller m'], 0, 'Yes. The steeper the run, the further m is from 0.');
    ex.step(4, 5);
    ex.say('Gradient is <b>rise ÷ run</b>: how far up or down for how far across.');
    await ex.input('A run has <b>rise 6</b> and <b>run 2</b>. Predict m.', Q(3), 'm = 6 ÷ 2 = 3.', 'm =', 'Divide the rise by the run: 6 ÷ 2.');
    ex.step(5, 5);
    ex.say('Now build it: drag the handle to make <b>rise 6, run 2</b>.');
    rig.unlock();
    await ex.task(rig.until((m, B) => B.x - A.x === 2 && B.y - A.y === 6));
    rig.lock();
    await ex.watch(rig.ride());
    await ex.ok('That is m = 3: up 3 for every 1 across.');
  }

  async function exploreBlack(ctx) {
    const { g, ex } = ctx;
    const A = { x: -4, y: -2 };
    ex.step(1, 5);
    ex.say('This run has <b>m = ½</b>: the rider climbs <b>1</b> for every <b>2</b> across. Drag the handle to make <b>m = ⅓</b>.');
    const rig = slopeRig(ctx, A, { x: -2, y: -1 });
    await ex.task(rig.until(m => qeq(m, Q(1, 3))));
    rig.lock();
    await ex.ok('Up 1 for every 3 across. That is m = ⅓.');
    ex.step(2, 5);
    ex.say('Now make <b>m = −½</b>.');
    rig.unlock();
    await ex.task(rig.until(m => qeq(m, Q(-1, 2))));
    rig.lock();
    await ex.ok('Down 1 for every 2 across. That is m = −½.');
    ex.step(3, 5);
    await ex.choice('In m = −½, what does the <b>2</b> on the bottom mean on the mountain?', ['How far across (the run)', 'How far up or down (the rise)', 'Where the run starts'], 0,
      'Yes. The bottom number is the <b>run</b> and the top number is the <b>rise</b>.');
    ex.step(4, 5);
    g.clear();
    ex.clearWork();
    ex.say(`Drag the cyan <b>Base Station</b> handle up or down the y-axis to set <b>c</b>. Drag the orange handle to set the slope <b>m</b>. Make ${eq('y = ½x − 3')}.`);
    const rig2 = eqRig(ctx);
    await ex.task(rig2.until((m, c) => qeq(m, Q(1, 2)) && c === -3));
    rig2.lock();
    await ex.ok('Start at −3 on the y-axis, then up 1 for every 2 across.');
    ex.step(5, 5);
    ex.say(`One more. Make ${eq('y = −2x + 4')}.`);
    rig2.unlock();
    await ex.task(rig2.until((m, c) => qeq(m, Q(-2)) && c === 4));
    rig2.lock();
    await ex.watch(rig2.ride());
    await ex.ok('Nailed it. <b>m</b> sets the slope and <b>c</b> sets where the run crosses the y-axis.');
  }

  async function exploreDouble(ctx) {
    const { g, ex, panel } = ctx;
    const A = { x: 1, y: 3 }, B = { x: 4, y: 9 };
    ex.step(1, 5);
    ex.say('No line this time, just two gates: <b>A (1, 3)</b> and <b>B (4, 9)</b>. Let\'s find the run that goes through both.');
    const flags = gateFlags(g, [A, B]);
    letterFlag(g, A, 'A'); letterFlag(g, B, 'B');
    await ex.input('Call A = (x₁, y₁) and B = (x₂, y₂). How far <b>across</b> is it from A to B? (run = x₂ − x₁)', Q(3), 'run = 4 − 1 = 3.', 'run =', 'Subtract the x values: 4 − 1.');
    ex.step(2, 5);
    await ex.input('How far <b>up</b>? (rise = y₂ − y₁)', Q(6), 'rise = 9 − 3 = 6.', 'rise =', 'Subtract the y values: 9 − 3.');
    g.triangle(A, B);
    ex.step(3, 5);
    await ex.input('So what is the gradient? (m = rise ÷ run)', Q(2), 'm = 6 ÷ 3 = 2.', 'm =', 'Divide the rise by the run: 6 ÷ 3.');
    ex.step(4, 5);
    await ex.input('Now find c. Put Gate A into y = 2x + c: 3 = 2 × 1 + c. What is c?', Q(1), 'c = 3 − 2 = 1.', 'c =', '3 = 2 + c. What do you add to 2 to get 3?');
    g.line(2, 1);
    await ex.watch(g.ride(L.clipLine(2, 1), { gates: flags }));
    await ex.ok(`The run is ${eq('y = 2x + 1')}. That is how you get an equation from two gates.`);
    ex.step(5, 5);
    g.clear();
    ex.clearWork();
    ex.say('One trap to watch for. In this table x goes up by <b>2</b> each step, not 1.');
    const tw = tableWidget(panel.work, { xs: [0, 2, 4], ys: [1, 5, 9], diffs: 'show' });
    gateFlags(g, [{ x: 0, y: 1 }, { x: 2, y: 5 }, { x: 4, y: 9 }]);
    g.line(2, 1);
    tw.showDiff(0, '+4'); tw.showDiff(1, '+4');
    await ex.choice('y goes up by 4 each step. What is the gradient m?', ['4', '2', '8'], 1,
      'Yes. Each step is 2 across, so m = 4 ÷ 2 = 2. Always check how x goes up!');
  }

  async function exploreTriple(ctx) {
    const { g, ex } = ctx;
    // The first worked example from the Lesson 7 worksheet: y = ½x + 2.
    const pts = [{ x: -4, y: 0 }, { x: -2, y: 1 }, { x: 0, y: 2 }, { x: 2, y: 3 }];
    ex.step(1, 6);
    ex.say('This is the worksheet from Lesson 7. You describe the run in four parts: the <b>y-intercept</b>, <b>positive or negative</b>, the <b>slope</b>, then the <b>equation</b>.');
    g.line(0.5, 2);
    const flags = gateFlags(g, pts);
    await ex.input('Where does the run cross the y-axis? That y value is the <b>y-intercept</b>.', Q(2), 'Yes. It crosses at (0, 2), so the y-intercept is 2.', 'Y-intercept =', 'Find where the line meets the y-axis, the vertical line where x = 0.');
    g.station({ x: 0, y: 2 }, 'Y-INTERCEPT', { cls: 'cyan', layer: 'guides' });
    ex.step(2, 6);
    await ex.choice('Read the run from <b>left to right</b>. Is the slope positive or negative?', ['Positive: it goes uphill', 'Negative: it goes downhill'], 0,
      'Right. Uphill, reading left to right, is a <b>positive</b> slope.');
    ex.step(3, 6);
    g.triangle({ x: 0, y: 2 }, { x: 2, y: 3 });
    await ex.input('From the flag at (0, 2) to the flag at (2, 3), how far <b>across</b> is it? That is the <b>run</b>.', Q(2), 'Yes. 2 across, so run = 2.', 'run =', 'Count the squares across from x = 0 to x = 2.');
    await ex.input('And how far <b>up</b>? That is the <b>rise</b>.', Q(1), 'Yes. Up 1, so rise = 1.', 'rise =', 'Count the squares up from y = 2 to y = 3.');
    ex.step(4, 6);
    await ex.input('Slope = rise ÷ run. What is m?', Q(1, 2), 'm = 1 ÷ 2 = ½. It does not divide exactly, so leave it as a fraction.', 'm =', 'Divide the rise by the run: 1 ÷ 2. Write it as a fraction, 1/2.');
    ex.step(5, 6);
    await ex.choice('Put m and the y-intercept into y = mx + c. Which is the equation?', ['y = ½x + 2', 'y = 2x + ½', 'y = 2x + 2'], 0,
      'Yes! m = ½ goes in front of x, and the y-intercept 2 goes on the end.',
      () => g.ride(L.clipLine(0.5, 2), { gates: flags }));
    ex.step(6, 6);
    g.clear();
    ex.clearWork();
    ex.say('The second worked example from the worksheet. Same four parts.');
    g.line(2 / 3, -4);
    gateFlags(g, [{ x: 0, y: -4 }, { x: 3, y: -2 }, { x: 6, y: 0 }]);
    g.triangle({ x: 0, y: -4 }, { x: 3, y: -2 });
    await ex.choice('The y-intercept is −4. From (0, −4) to (3, −2) is run 3, rise 2. Which equation is it?', ['y = ⅔x − 4', 'y = 3/2x − 4', 'y = ⅔x + 4'], 0,
      'Right. m = rise ÷ run = 2 ÷ 3 = ⅔, and the y-intercept −4 goes on the end. Downhill runs work the same way, with a negative rise. Now try the Challenge!');
  }

  function makeHud(root) {
    const bar = root.querySelector('.progress b'), pct = root.querySelector('.hud-pct'), att = root.querySelector('.hud-attempt b');
    const stage = root.querySelector('.hud-stage'), prog = root.querySelector('.hud-progress'), attWrap = root.querySelector('.hud-attempt');
    return {
      stage(t) {
        stage.textContent = t;
        stage.className = 'pill hud-stage ' + t.toLowerCase();
        prog.hidden = t !== 'Challenge';
        attWrap.hidden = t !== 'Challenge';
      },
      setStreak(n) {
        const p = Math.min(100, Math.round(100 * n / STREAK_GOAL));
        bar.style.width = p + '%';
        pct.textContent = p + '%';
        prog.setAttribute('aria-label', `${n} of ${STREAK_GOAL} in a row`);
      },
      setAttempt(n) { att.textContent = n; }
    };
  }

  async function playRun(ctx) {
    const { run, session, g, hud } = ctx;
    const stats = runStats(run.id);
    const exS = new Session(session);
    const exCtx = Object.assign({}, ctx, { session: exS, panel: new Panel(ctx.panel.el, exS) });
    exCtx.ex = makeEx(exCtx);
    hud.stage('Explore');
    exCtx.panel.layout('Explore', '');

      const skip = exCtx.panel.extra.appendChild(h('<button class="linkbtn" type="button">Skip to Challenge ▶</button>'));
      skip.addEventListener('click', () => exS.kill());
    }
    try {
      await run.explore(exCtx);
      stats.exploreDone = true;
      persist();
      exCtx.panel.setMeta('Done');
      exCtx.panel.say('Nice work. You are ready for the <b>Challenge</b>: get 5 right first time in a row to clear the run.');
      await exCtx.panel.waitButton('Start the Challenge ▶');

  async function runChallenge(ctx) {
    const { run, g, panel, session, hud } = ctx;
    const stats = runStats(run.id);
    let streak = 0, attempt = 1, lastType = null, lastKey = null;
    hud.stage('Challenge');
    hud.setStreak(0);
    hud.setAttempt(1);
    for (;;) {
      let type = run.pick(streak, lastType), q = MAKERS[type]();
      for (let tries = 0; q.key === lastKey && tries < 10; tries++) q = MAKERS[type]();
      lastType = type; lastKey = q.key;
      if (DEBUG) window.__SR = { type, q, data: q.data, streak, attempt };
      panel.layout('Challenge', streak ? `${streak} in a row · ${STREAK_GOAL - streak} to clear` : `Get ${STREAK_GOAL} in a row to clear`);
      g.clear();
      if (streak === 0 && attempt === 1) g.attempt(1);
      q.mount(ctx);
      let wrong = 0;
      for (;;) {
        panel.clearActions();
        const btn = panel.button('Check ✓');
        let onDoc = null;
        try {
          await session.wait(new Promise(res => {
            btn.addEventListener('click', res, { once: true });
            panel.work.onkeydown = e => {
              if (e.key !== 'Enter' || !e.target.matches('input')) return;
              e.preventDefault();
              // Enter in a box jumps to the next empty box first, so a half-finished answer is never marked.
              const empty = [...panel.work.querySelectorAll('input.ans')].find(i => !i.disabled && !i.value.trim());
              if (empty && empty !== e.target) { empty.focus(); return; }
              res();
            };
            onDoc = e => {
              if (e.key === 'Enter' && (e.target === document.body || (e.target.closest && e.target.closest('svg.graph')))) { e.preventDefault(); res(); }
            };
            document.addEventListener('keydown', onDoc);
          }));
        } finally {
          panel.work.onkeydown = null;
          if (onDoc) document.removeEventListener('keydown', onDoc);
        }
        const ans = q.read();
        if (ans.status !== 'ok') { panel.feedback(ans.msg || INVALID_MSG, 'info'); continue; }
        const res = q.check();
        stats.subs++;
        if (res.correct) stats.correct++;
        q.lock(true);
        panel.clearActions();
        panel.feedback('Riding your answer…', 'info');
        await session.wait(q.play(res));
        if (res.correct) {
          if (wrong === 0) streak++;
          hud.setStreak(streak);
          g.pulse();
          persist();
          if (wrong === 0) {
            const left = STREAK_GOAL - streak;
            panel.feedback(`<b>${cheer()}</b> ${streak} in a row.${left > 0 ? ` ${left} more to clear the run.` : ''}`, 'good');
          } else {
            panel.feedback('<b>Nice recovery!</b> That one doesn\'t add to your streak. Get the next one right first time to start it again.', 'good');
          }
          if (streak >= STREAK_GOAL) { await session.wait(wait(REDUCED ? 0 : 700)); await runCleared(ctx); return; }
          await panel.waitButton('Next ▶');
          break;
        }
        wrong++;
        streak = 0;
        attempt++;
        stats.wipeouts++;
        if (wrong < 3) stats.hints++;
        hud.setStreak(0);
        hud.setAttempt(attempt);
        g.attempt(attempt);
        panel.setMeta(`Get ${STREAK_GOAL} in a row to clear`);
        panel.feedback(`<b>Wipeout!</b> ${res.msg || ''}`, 'bad');
        if (wrong < 3) {
          panel.hint(wrong, q.hint(wrong));
          persist();
          q.lock(false);
          continue;
        }
        panel.hint(3, q.solve());
        persist();
        await panel.waitButton('Fresh question ▶');
        break;
      }
    }
  }

  async function runCleared(ctx) {
    const { run, idx, session, g } = ctx;
    const stats = runStats(run.id);
    const firstClear = !stats.cleared;
    stats.cleared = true;

    const next = RUNS[idx + 1];
    const acc = accuracy(stats);
    const last = !next;
    const ov = document.body.appendChild(h(`
      <div class="overlay" role="dialog" aria-modal="true" aria-label="Run cleared">
        <div class="cleared-card" style="--glow:${run.color}">

          <h2 class="outline">${last ? 'Mountain conquered!' : 'Run cleared!'}</h2>
          <p class="cleared-sub">${run.name} · 5 in a row</p>
          <div class="cleared-stats">
            <div><b class="outline">${acc ?? 0}%</b><span>accuracy</span></div>
            <div><b class="outline">${stats.wipeouts}</b><span>wipeouts</span></div>
            <div><b class="outline">${stats.hints}</b><span>hints</span></div>
          </div>
          <p class="cleared-note">${last ? 'You cleared every run on the mountain. Show your teacher your Lift Pass!' : (firstClear ? `${next.name} is now unlocked.` : 'Run cleared again. Keep it sharp!')}</p>
          <div class="cleared-actions">
            ${next ? `<button class="btn" type="button" data-v="next">${next.name} ▶</button>` : '<button class="btn" type="button" data-v="pass">🎫 Lift Pass</button>'}
            <button class="btn secondary" type="button" data-v="map">Map</button>
          </div>
        </div>
      </div>`));
    for (let k = 0; k < 4; k++) setTimeout(() => g.burst(g.X(-4 + k * 2.7), g.Y(6 - k), 14), k * 160);
    const choice = await session.wait(new Promise(res => {
      ov.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => res(b.dataset.v)));
      setTimeout(() => { const b = ov.querySelector('[data-v]'); if (b) b.focus({ preventScroll: true }); }, 60);
    }));
    ov.remove();
    if (choice === 'next') startRun(idx + 1);
    else if (choice === 'pass') showPass();
    else showMap();
  }

  showMap();
  // Preview a walkthrough: #help-fill or #help-fill-3 (opens at step 3).
  const helpLink = /help-(fill|read|straight)(?:-(\d+))?/i.exec(location.hash);
  if (helpLink) showHelp(helpLink[1].toLowerCase(), helpLink[2] ? helpLink[2] - 1 : 0);
  // Teacher shortcut: #teacher-run3 opens Run 3, #teacher-run3-challenge goes straight to its Challenge.
  const deep = /run(\d)/i.exec(location.hash);
  if (deep && RUNS[deep[1] - 1] && unlocked(deep[1] - 1)) {
    if (/challenge/i.test(location.hash)) runStats(RUNS[deep[1] - 1].id).exploreDone = true;
    startRun(deep[1] - 1);
    if (/challenge/i.test(location.hash)) { const skip = document.querySelector('.pextra .linkbtn'); if (skip) skip.click(); }
  }
})();

</script>
</body>
</html>
