<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slope Rider</title>
<meta name="description" content="A snowboard game for Year 8: plot linear graphs, find gradients and intercepts, and write y = mx + c.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>
// If anything stops the game from starting, show what happened instead of a blank page.
(function () {
  function show(msg) {
    if (document.getElementById('boot-error')) return;
    var box = document.createElement('div');
    box.id = 'boot-error';
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;inset:auto 16px 16px 16px;z-index:99;padding:16px 18px;border-radius:12px;background:#2a0f2f;color:#fff;border:2px solid #ff4d5e;font:15px/1.5 system-ui,sans-serif;max-width:46rem;margin:0 auto';
    box.innerHTML = '<b>Slope Rider hit a problem and could not start properly.</b><br>Try reloading. If it keeps happening, reset saved progress or try another browser.<br><code style="display:block;margin:8px 0;white-space:pre-wrap;color:#ffe14d"></code><button type="button" style="font:inherit;padding:6px 12px;border-radius:8px;border:0;background:#a6ff2e;cursor:pointer">Reset saved progress and reload</button>';
    box.querySelector('code').textContent = String(msg).slice(0, 400);
    box.querySelector('button').onclick = function () { try { localStorage.removeItem('slopeRider.v1'); } catch (e) {} location.reload(); };
    (document.body || document.documentElement).appendChild(box);
  }
  window.__srBootError = show;
  window.addEventListener('error', function (e) {
    // Only the game's own scripts count. Errors from browser extensions arrive with another file or as a bare "Script error."
    var page = location.href.split('#')[0];
    if (!e.filename || e.filename.split('#')[0] !== page) return;
    show((e.message || 'Script error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
  window.addEventListener('load', function () {
    var app = document.getElementById('app');
    if (app && !app.children.length) show('The game screen did not load. JavaScript may be blocked for local files by a browser extension or setting.');
  });
})();
</script>
<style>
/* Slope Rider: Geometry Dash on snow. Neon on a dark block grid, chunky outlined type. One dark look by design. */
:root {
  --bg: #120B33;
  --sky: #24127F;
  --panel: #1B1350;
  --panel-2: #241A68;
  --edge: #3D3199;
  --fg: #F4F1FF;
  --muted: #BBB4EA;
  --ink: #07041A;
  --cyan: #19E3FF;
  --lime: #A6FF2E;
  --pink: #FF3DCB;
  --yellow: #FFE14D;
  --orange: #FF8A1F;
  --purple: #8B5CFF;
  --red: #FF4D5E;
  --green: #3DF58B;
  --blue: #4D8DFF;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Exo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --hud-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(180deg, var(--sky) 0, var(--bg) 700px);
  background-size: 40px 40px, 40px 40px, 100% 100%;
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; }
p { margin: 0; }
b, strong { font-weight: 700; }
.outline {
  text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink);
}
.eq {
  font-family: var(--mono); font-size: 0.92em; white-space: nowrap;
  background: var(--ink); color: var(--yellow); padding: 0.05em 0.4em; border-radius: 5px; border: 1px solid var(--edge);
}
.eyebrow { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--lime); }
[hidden] { display: none !important; }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--display); font-size: 1.2rem; letter-spacing: 0.02em; line-height: 1;
  padding: 0.7em 1.2em; border-radius: 12px; border: 3px solid var(--ink);
  background: var(--lime); color: var(--ink); cursor: pointer;
  box-shadow: 0 4px 0 var(--ink), 0 0 0 2px rgba(255,255,255,0.15);
  transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
  touch-action: manipulation;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .opt:focus-visible, .toggle:focus-visible, .run-card:focus-visible, .linkbtn:focus-visible {
  outline: 3px solid var(--cyan); outline-offset: 3px;
}
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.small { font-size: 1rem; padding: 0.5em 0.9em; border-radius: 10px; }
.btn.secondary { background: var(--panel-2); color: var(--fg); box-shadow: 0 4px 0 var(--ink), 0 0 0 2px var(--edge); }
.btn.ghost { background: rgba(7,4,26,0.55); color: var(--fg); box-shadow: 0 3px 0 var(--ink), 0 0 0 2px var(--edge); }
.btn.danger { background: var(--red); color: var(--ink); }
.btn.danger-ghost { background: transparent; color: var(--red); box-shadow: 0 0 0 2px var(--red); border-color: transparent; }
.linkbtn { background: none; border: 0; color: var(--cyan); font: inherit; font-weight: 700; cursor: pointer; padding: 0.2rem 0.3rem; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- map screen ---------- */
.screen { min-height: 100vh; min-height: 100dvh; }
.map-screen, .pass-screen {
  max-width: 68rem; margin: 0 auto; display: grid; gap: 1.6rem; align-content: start;
  padding-block: 1.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.title { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 1.5rem; align-items: center; }
.title-art { width: 100%; height: auto; display: block; border-radius: 14px; border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--edge), 0 14px 40px rgba(0,0,0,0.45); }
.title-text { display: grid; gap: 0.5rem; }
.title h1 { font-size: clamp(3rem, 9vw, 5.6rem); }
.tag { font-size: 1.15rem; color: var(--muted); }
.howto { max-width: 70ch; color: var(--muted); font-size: 1.02rem; }
.howto b { color: var(--fg); }
.runs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; }
.run-card {
  font: inherit; color: var(--fg); text-align: left; cursor: pointer;
  display: grid; gap: 0.45rem; align-content: start;
  padding: 1rem 1.1rem 1.1rem; border-radius: 14px; border: 3px solid var(--ink);
  background: linear-gradient(160deg, color-mix(in srgb, var(--glow) 22%, var(--panel-2)), var(--panel) 65%);
  box-shadow: 0 0 0 2px var(--edge), 0 0 24px -8px var(--glow), 0 5px 0 var(--ink);
  transition: transform 0.12s, box-shadow 0.12s;
}
.run-card:hover:not([disabled]) { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--glow), 0 0 30px -4px var(--glow), 0 8px 0 var(--ink); }
.run-card.locked { cursor: not-allowed; filter: grayscale(0.75) brightness(0.7); }
.rc-top { display: flex; align-items: center; gap: 0.55rem; font-size: 0.82rem; color: var(--muted); }
.rc-top .sign { width: 26px; height: 26px; flex: none; }
.rc-num { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.rc-status { margin-left: auto; font-weight: 700; color: var(--fg); }
.run-card.cleared .rc-status { color: var(--lime); }
.rc-name { font-family: var(--display); font-size: 1.9rem; line-height: 1; }
.rc-topic { color: var(--muted); font-size: 0.95rem; min-height: 2.8em; }
.rc-bar { height: 12px; border-radius: 6px; background: rgba(7,4,26,0.6); border: 2px solid var(--ink); box-shadow: 0 0 0 1px rgba(255,255,255,0.25); overflow: hidden; }
.rc-bar b { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), #5CFF8A); }
.rc-acc { font-size: 0.85rem; color: var(--muted); }
.map-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
.teacher-badge { font-size: 0.85rem; font-weight: 700; color: var(--ink); background: var(--yellow); padding: 0.3rem 0.7rem; border-radius: 8px; border: 2px solid var(--ink); }

/* ---------- lift pass ---------- */
.pass-screen { max-width: 46rem; justify-items: stretch; }
.pass-screen > .btn { justify-self: start; }
.pass {
  border: 3px solid var(--ink); border-radius: 18px; overflow: hidden;
  background: linear-gradient(160deg, #3A1FB0, #1A2C9E 60%, #0F5AA8);
  box-shadow: 0 0 0 2px var(--cyan), 0 0 36px -4px rgba(25,227,255,0.5);
  font-variant-numeric: tabular-nums;
}
.pass-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.8rem 1.2rem; padding: 1.1rem 1.25rem 0.5rem; }
.pass-top .t { font-family: var(--display); font-size: 2.6rem; line-height: 1; }
.pass-name { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }
.pass-name input { font: inherit; font-size: 1.05rem; text-transform: none; letter-spacing: 0; width: 12rem; max-width: 50vw; padding: 0.45rem 0.6rem; border-radius: 8px; border: 2px solid var(--ink); background: rgba(7,4,26,0.55); color: var(--fg); }
.pass-name input:focus { outline: 3px solid var(--cyan); outline-offset: 1px; }
.pass-head { display: grid; grid-template-columns: 10rem minmax(0, 1fr); column-gap: 0.8rem; padding: 0.4rem 1.25rem 0; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,241,255,0.75); }
.pass-rows { display: grid; gap: 0.75rem; padding: 0.8rem 1.25rem 1rem; }
.prow { display: grid; grid-template-columns: 10rem minmax(0, 1fr) 3.4rem; grid-template-rows: auto auto; column-gap: 0.8rem; row-gap: 0.15rem; align-items: center; }
.prow.locked { opacity: 0.55; }
.runname { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 700; min-width: 0; }
.runname svg { width: 18px; height: 18px; flex: none; }
.bar { height: 18px; border-radius: 9px; background: rgba(7,4,26,0.6); border: 2px solid var(--ink); box-shadow: 0 0 0 1px rgba(255,255,255,0.35); overflow: hidden; }
.bar b { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), #5CFF8A); }
.pct { font-family: var(--display); font-size: 1.15rem; text-align: right; }
.pdetail { grid-column: 2 / 4; font-size: 0.8rem; color: rgba(244,241,255,0.8); }
.pass-foot { font-size: 0.9rem; padding: 0.7rem 1.25rem 1rem; border-top: 2px dashed rgba(255,255,255,0.25); }
.reset-zone { justify-self: start; }
.unlock-zone { display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; justify-self: start; }
.unlock-note { color: var(--muted); }
.confirm.ok { border-color: var(--lime); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; background: var(--panel); border: 2px solid var(--red); border-radius: 12px; padding: 0.8rem 1rem; }
.confirm p { flex-basis: 100%; }

/* ---------- run screen ---------- */
.run-screen { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
.hud {
  height: var(--hud-h); flex: none; display: flex; align-items: center; gap: 0.9rem;
  padding-block: 0;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: rgba(7,4,26,0.6); border-bottom: 3px solid var(--ink); box-shadow: 0 2px 0 var(--edge);
}
.hud-run { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.hud-run .sign { width: 26px; height: 26px; flex: none; }
.hud-name { font-family: var(--display); font-size: 1.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-weight: 800; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; padding: 0.3rem 0.65rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--cyan); color: var(--ink); white-space: nowrap; }
.pill.challenge { background: var(--yellow); }
.hud-progress { flex: 1 1 auto; max-width: 340px; margin-left: auto; display: flex; align-items: center; gap: 0.6rem; }
.progress { flex: 1; height: 20px; border-radius: 10px; border: 2.5px solid var(--fg); background: rgba(7,4,26,0.65); box-shadow: 0 0 0 2px var(--ink); overflow: hidden; }
.progress b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lime), #6CFF7E); transition: width 0.45s cubic-bezier(.3,1.4,.5,1); }
.hud-pct { font-family: var(--display); font-size: 1.3rem; min-width: 3.2rem; text-align: right; }
.hud-attempt { font-family: var(--display); font-size: 1.1rem; white-space: nowrap; }
.stage {
  flex: 1; min-height: 0; display: flex; gap: 1rem; justify-content: center; align-items: stretch;
  height: calc(100vh - var(--hud-h)); height: calc(100dvh - var(--hud-h));
  padding-block: 0.8rem 0.9rem;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.graph-wrap {
  height: 100%; aspect-ratio: 408 / 678; max-width: calc(100vw - 25rem); flex: none;
  border-radius: 14px; border: 3px solid var(--ink); overflow: hidden;
  box-shadow: 0 0 0 2px var(--edge), 0 0 30px -10px var(--glow), 0 14px 36px rgba(0,0,0,0.45);
  background: #0E0828;
}
.graph { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.graph.tappable { cursor: crosshair; }
.panel {
  flex: 0 1 31rem; min-width: 20rem; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 0.9rem;
  background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 0 0 2px var(--edge);
  padding: 1rem 1.1rem 1.2rem;
}
.panel > * { flex-shrink: 0; }
.phead { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.pmeta { color: var(--muted); font-size: 0.88rem; font-weight: 600; }
.pextra { margin-left: auto; }
.coach { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0.75rem; align-items: start; }
.avatar { width: 56px; height: 56px; border-radius: 12px; border: 3px solid var(--ink); background: linear-gradient(160deg, #2B1590, #0E0828); box-shadow: 0 0 0 2px var(--edge); display: grid; place-items: center; }
.avatar svg { width: 48px; height: 48px; }
.bubble { font-size: 1.05rem; line-height: 1.5; padding-top: 0.15rem; }
.bubble b { color: var(--yellow); }
.work { display: grid; gap: 0.85rem; }
.counter { color: var(--muted); font-size: 0.95rem; }
.counter b { color: var(--fg); }
.tip { color: var(--muted); font-size: 0.82rem; }
.fb { min-height: 1.4em; font-size: 1rem; }
.fb:empty { display: none; }
.fb.good { color: var(--lime); }
.fb.bad { color: var(--red); }
.fb.info { color: var(--cyan); }
.fb b { font-family: var(--display); font-weight: 400; font-size: 1.15em; letter-spacing: 0.02em; }
.hintbox { border-left: 5px solid var(--yellow); background: rgba(255,225,77,0.08); border-radius: 0 10px 10px 0; padding: 0.6rem 0.85rem; display: grid; gap: 0.25rem; }
.hintbox.solution { border-left-color: var(--cyan); background: rgba(25,227,255,0.08); }
.hint-label { font-weight: 800; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--yellow); }
.hintbox.solution .hint-label { color: var(--cyan); }
.hint-body { font-size: 0.98rem; }
.hint-body .mistake { margin: 0 0 0.5rem; }
.hint-body .steps { margin: 0; padding-left: 1.4rem; display: grid; gap: 0.4rem; }
.hint-body .steps li::marker { color: var(--cyan); font-weight: 800; }
.actions { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: auto; padding-top: 0.2rem; }
.actions:empty { display: none; }

/* inputs */
.ans {
  font-family: var(--mono); font-weight: 600; font-size: 1.15rem; text-align: center;
  width: 4.6rem; min-width: 0; padding: 0.4rem 0.3rem; border-radius: 8px;
  background: var(--ink); color: var(--yellow); border: 2px solid var(--edge);
}
.ans:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(25,227,255,0.35); }
.ans.ok { border-color: var(--lime); color: var(--lime); }
.ans.bad { border-color: var(--red); color: var(--red); animation: shake 0.35s; }
.ans:disabled { opacity: 1; cursor: default; }
.numrow { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 1.05rem; }
.numrow .pre { font-weight: 600; }
.numrow .post:empty { display: none; }
.eqw { display: flex; align-items: center; gap: 0.5rem; font-family: var(--mono); font-weight: 600; font-size: 1.45rem; flex-wrap: wrap; }
.eqw .ans { width: 5.2rem; font-size: 1.25rem; }

/* tables */
.tbl { display: grid; gap: 0.35rem 0; align-items: center; font-family: var(--mono); font-weight: 600; }
.th { font-family: var(--display); font-size: 1.25rem; color: var(--cyan); text-align: center; }
.th.small { font-family: var(--body); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cell { text-align: center; padding: 0.3rem 0.15rem; border-radius: 7px; border: 2px solid transparent; font-size: 1.1rem; min-width: 0; }
.cell.xc { background: rgba(25,227,255,0.1); }
.cell.yc { background: rgba(255,225,77,0.08); }
.cell.ok { border-color: var(--lime); }
.cell.bad { border-color: var(--red); }
.cell.hl { border-color: var(--yellow); box-shadow: 0 0 14px rgba(255,225,77,0.5); }
.cell .ans { width: 100%; font-size: 1.05rem; padding: 0.3rem 0.1rem; }
.cell.dc { padding: 0; }
.cell.dc .ans { font-size: 0.95rem; color: var(--lime); }
.dbub { display: inline-block; font-size: 0.9rem; color: var(--lime); background: rgba(166,255,46,0.12); border: 1px solid rgba(166,255,46,0.5); border-radius: 999px; padding: 0.05rem 0.4rem; animation: pop 0.35s; }
.dbub.hint { color: var(--yellow); border-color: var(--yellow); background: rgba(255,225,77,0.12); }
.tbl-wrap { display: grid; gap: 0.35rem; }
.tbl-title { font-weight: 700; }
.tbl-wrap.a .tbl-title { color: var(--green); }
.tbl-wrap.b .tbl-title { color: var(--cyan); }

/* explore bits */
.choice { display: grid; gap: 0.55rem; padding: 0.8rem 0.9rem; border-radius: 12px; background: rgba(7,4,26,0.4); border: 2px solid var(--edge); }
.choice .q { font-weight: 600; font-size: 1.05rem; }
.opts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.opt, .toggle {
  font: inherit; font-weight: 700; color: var(--fg); cursor: pointer;
  padding: 0.55rem 0.9rem; border-radius: 10px; border: 2px solid var(--edge);
  background: var(--panel-2); box-shadow: 0 3px 0 var(--ink);
  touch-action: manipulation;
}
.opt:hover:not(:disabled), .toggle:hover:not(:disabled) { border-color: var(--cyan); }
.opt.ok { background: var(--lime); color: var(--ink); border-color: var(--ink); }
.opt.bad { border-color: var(--red); color: var(--red); text-decoration: line-through; opacity: 0.8; }
.opt:disabled { cursor: default; }
.verdict { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.toggle[aria-pressed="true"] { background: var(--yellow); color: var(--ink); border-color: var(--ink); }
.toggle:disabled { cursor: default; }
.readout { font-family: var(--mono); font-size: 1rem; padding: 0.55rem 0.8rem; border-radius: 10px; background: var(--ink); border: 1px solid var(--edge); color: var(--fg); }
.readout b { color: var(--yellow); }
.readout.big { font-size: 1.5rem; color: var(--yellow); display: grid; gap: 0.2rem; }
.readout-sub { font-size: 0.9rem; color: var(--muted); }

/* ---------- graph contents ---------- */
.gridlines { stroke: rgba(255,255,255,0.11); stroke-width: 1; fill: none; }
.axis { stroke: rgba(255,255,255,0.6); stroke-width: 2; fill: none; transition: stroke 0.2s; }
.axis.hot { stroke: var(--cyan); stroke-width: 4; filter: url(#glow); animation: blink 1s ease-in-out infinite; }
.ticks text { font-family: var(--mono); font-size: 13px; font-weight: 600; fill: rgba(244,241,255,0.7); paint-order: stroke; stroke: #0E0828; stroke-width: 3px; stroke-linejoin: round; }
.ticks .axis-name { font-family: var(--display); font-size: 16px; fill: var(--fg); }
.run-line { stroke-width: 5; stroke-linecap: round; fill: none; filter: url(#glow); }
.run-line.student { stroke: var(--pink); stroke-width: 4; stroke-dasharray: 12 9; }

/* ---------- ? help ---------- */
.help-btn {
  margin-left: 0.4rem; width: 2rem; height: 2rem; flex: none; border-radius: 50%;

}
.pextra:empty + .help-btn { margin-left: auto; }
.help-btn:hover { filter: brightness(1.08); }
.help-btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.rule-words { font-weight: 500; color: var(--muted); }
.help-card {
  width: min(52rem, 100%); max-height: calc(100dvh - 32px); overflow: auto; display: grid; gap: 0.75rem;
  padding: 1.2rem 1.3rem 1.3rem; border-radius: 18px; border: 3px solid var(--ink);

/* ---------- motion ---------- */
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@keyframes linepulse { 0% { stroke-width: 11; } 100% { stroke-width: 5; } }
@keyframes flagfall { 0% { transform: rotate(0); opacity: 1; } 15% { transform: rotate(-16deg); } 30% { transform: rotate(14deg); } 100% { transform: rotate(95deg) translateY(10px); opacity: 0; } }
@keyframes gatehit { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes boom { 0% { r: 6px; opacity: 1; } 100% { r: 46px; opacity: 0; } }
@keyframes bannerpop { 0% { opacity: 0; transform: translateY(10px); } 12% { opacity: 1; transform: translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; } }
@keyframes attempt { 0% { opacity: 0; } 10% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flash { 0%, 100% { opacity: 0; } 10%, 30%, 50% { opacity: 1; } 20%, 40% { opacity: 0.3; } 80% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }

.grow line { stroke-width: 4; stroke-linecap: round; filter: url(#glow); }
.grow-run line { stroke: var(--yellow); }
.grow-rise line { stroke: var(--pink); }

.grow-rise .grow-label { fill: var(--pink); }

.toggle.bad { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }

<script>
/* Slope Rider: fractions, answer parsing and question generators. No DOM, so it runs in Node tests too. */
(function (root) {
  'use strict';

  const BOX = { xmin: -6, xmax: 6, ymin: -10, ymax: 10 };
  const MINUS = '−';

  // ---------- random ----------
  let rand = Math.random;
  function setSeed(seed) {
    let a = seed >>> 0;
    rand = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const pick = arr => arr[Math.floor(rand() * arr.length)];
  const chance = p => rand() < p;
  function range(a, b, step = 1) { const out = []; for (let i = a; i <= b; i += step) out.push(i); return out; }
  const nonZero = n => range(-n, n).filter(v => v !== 0);
  function weighted(pairs) {
    const total = pairs.reduce((s, p) => s + p[1], 0);
    let r = rand() * total;
    for (const [v, w] of pairs) { r -= w; if (r < 0) return v; }
    return pairs[pairs.length - 1][0];
  }

  // ---------- fractions ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function Q(n, d = 1) {

      for (let y = -10; y <= 10; y++) if (y) svgEl('text', { x: this.X(0) - 6, y: this.Y(y) + 4, 'text-anchor': 'end' }, t).textContent = L.fmt(y);
      svgEl('text', { x: this.X(0) - 6, y: this.Y(0) + 15, 'text-anchor': 'end' }, t).textContent = '0';
      svgEl('text', { x: this.X(6.55), y: this.Y(0) - 7, 'text-anchor': 'end', class: 'axis-name' }, t).textContent = 'x';
      svgEl('text', { x: this.X(0) + 8, y: this.Y(10.35), class: 'axis-name' }, t).textContent = 'y';
    }

    buildRider() {
      const g = this.layers.rider;
      this.trail = svgEl('path', { class: 'trail' }, g);
      this.riderG = svgEl('g', { class: 'rider', visibility: 'hidden' }, g);
      const bob = svgEl('g', { class: 'bob' }, this.riderG);
      svgEl('use', { href: '#rider', transform: 'scale(0.5) translate(-50 -91)' }, bob);
    }

    // ---------- clearing ----------
    clear() {
      this.gen = (this.gen || 0) + 1;
      for (const k of ['guides', 'lines', 'scratch', 'marks', 'handles', 'fx', 'overlay']) this.layers[k].innerHTML = '';
      this.handles = [];
      this.drag = null;
      this.setTap(null);
      this.hideRider();
      this.trail.setAttribute('d', '');
      this.axisHot(null);
      this.svg.classList.remove('pulse');
    }
    clearLayer(name) { this.layers[name].innerHTML = ''; }

    // ---------- drawing ----------
    line(m, c, opts = {}) {
      const x1 = -6.7, x2 = 6.7;
      return svgEl('line', {
        x1: this.X(x1), y1: this.Y(m * x1 + c), x2: this.X(x2), y2: this.Y(m * x2 + c),
        class: 'run-line ' + (opts.cls || ''), stroke: opts.color || this.color
      }, this.layers[opts.layer || 'lines']);
    }
    segment(a, b, opts = {}) {
      return svgEl('line', { x1: this.X(a.x), y1: this.Y(a.y), x2: this.X(b.x), y2: this.Y(b.y), class: opts.cls || 'run-line', stroke: opts.color || this.color }, this.layers[opts.layer || 'lines']);
    }
    polyline(points, opts = {}) {
      return svgEl('polyline', { points: points.map(p => this.P(p).join(',')).join(' '), class: opts.cls || 'run-line', stroke: opts.color || this.color, fill: 'none' }, this.layers[opts.layer || 'lines']);
    }
    dot(x, y, opts = {}) {
      return svgEl('circle', { cx: this.X(x), cy: this.Y(clamp(y, -10.6, 10.6)), r: opts.r || 6, class: 'dot ' + (opts.cls || '') }, this.layers[opts.layer || 'marks']);
    }
    flag(x, y, state = 'ok', layer = 'marks') {
      const g = svgEl('g', { class: 'flag ' + state, transform: `translate(${this.X(x)} ${this.Y(clamp(y, -10.6, 10.6))})` }, this.layers[layer]);
      const inner = svgEl('g', { class: 'flag-inner' }, g);
      svgEl('path', { d: 'M0 0V-26', class: 'pole' }, inner);
      svgEl('path', { d: 'M0 -26L18 -19.5L0 -13Z', class: 'cloth' }, inner);
      svgEl('circle', { r: 5, class: 'foot' }, inner);
      return g;
    }
    dropFlag(el) {
      el.classList.add('bad', 'fall');
      setTimeout(() => el.remove(), REDUCED ? 0 : 900);
    }
    label(x, y, text, opts = {}) {
      const e = svgEl('text', {
        x: this.X(x) + (opts.dx || 0), y: this.Y(y) + (opts.dy || 0),
        'text-anchor': opts.anchor || 'start', class: 'glabel ' + (opts.cls || '')
      }, this.layers[opts.layer || 'marks']);
      e.textContent = text;
      return e;
    }
    // A glowing marker for the Base Station or Snow Line, with a label placed clear of the line.
    station(p, name, opts = {}) {
      const g = svgEl('g', { class: 'station ' + (opts.cls || '') }, this.layers[opts.layer || 'marks']);
      svgEl('circle', { cx: this.X(p.x), cy: this.Y(p.y), r: 9 }, g);
      const right = p.x <= 2;
      const t = svgEl('text', {
        x: this.X(p.x) + (right ? 14 : -14), y: this.Y(p.y) + 50,
        'text-anchor': right ? 'start' : 'end', class: 'glabel big'
      }, g);
      t.textContent = `${name} (${L.fmt(p.x)}, ${L.fmt(p.y)})`;
      return g;
    }
    guide(points, layer = 'guides') {
      return svgEl('polyline', { points: points.map(p => this.P(p).join(',')).join(' '), class: 'guide', fill: 'none' }, this.layers[layer]);
    }
    // Rise/run triangle from A to B (graph coords). Labels show run and rise.
    triangle(A, B, opts = {}) {
      const g = svgEl('g', { class: 'tri ' + (opts.cls || '') }, this.layers[opts.layer || 'guides']);
      const C = { x: B.x, y: A.y };
      svgEl('line', { x1: this.X(A.x), y1: this.Y(A.y), x2: this.X(C.x), y2: this.Y(C.y), class: 'tri-run' }, g);
      svgEl('line', { x1: this.X(C.x), y1: this.Y(C.y), x2: this.X(B.x), y2: this.Y(B.y), class: 'tri-rise' }, g);
      if (opts.labels !== false) {
        const run = B.x - A.x, rise = B.y - A.y;
        const t1 = svgEl('text', { x: (this.X(A.x) + this.X(C.x)) / 2, y: this.Y(A.y) + (rise >= 0 ? 18 : -9), 'text-anchor': 'middle', class: 'glabel tri-run-label' }, g);
        t1.textContent = 'run ' + L.fmt(run);
        if (rise !== 0) {
          const t2 = svgEl('text', { x: this.X(C.x) + 7, y: (this.Y(A.y) + this.Y(B.y)) / 2 + 5, class: 'glabel tri-rise-label' }, g);
          t2.textContent = 'rise ' + L.fmt(rise);
        }
      }
      return g;
    }
    // Draw a straight line from a to b one grid square at a time, with a counting label. Resolves when done.
    grow(a, b, opts = {}) {
      const g = svgEl('g', { class: 'grow ' + (opts.cls || '') }, this.layers.guides);
      const seg = svgEl('line', { x1: this.X(a.x), y1: this.Y(a.y), x2: this.X(a.x), y2: this.Y(a.y) }, g);
      const lab = svgEl('text', { class: 'glabel grow-label' }, g);
      const n = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      const sx = Math.sign(b.x - a.x), sy = Math.sign(b.y - a.y);
      const gen = this.gen;
      return new Promise(resolve => {
        let i = 0;
        const step = () => {
          if (gen !== this.gen || !g.isConnected) return resolve();
          i++;
          const p = { x: a.x + sx * i, y: a.y + sy * i };
          seg.setAttribute('x2', this.X(p.x)); seg.setAttribute('y2', this.Y(p.y));
          lab.textContent = opts.label ? opts.label(i) : String(i);
          const mid = { x: (a.x + p.x) / 2, y: (a.y + p.y) / 2 };
          lab.setAttribute('x', this.X(mid.x) + (sx ? 0 : -8));
          const below = opts.below && this.Y(mid.y) + 20 < this.Y(-10.3);
          lab.setAttribute('y', this.Y(mid.y) + (sx ? (below ? 20 : -9) : 5));
          lab.setAttribute('text-anchor', sx ? 'middle' : 'end');
          if (i < n) setTimeout(step, REDUCED ? 0 : 480); else resolve();
        };
        if (n === 0) resolve(); else setTimeout(step, REDUCED ? 0 : 250);
      });
    }
    axisHot(which) {
      this.xAxis.classList.toggle('hot', which === 'x');
      this.yAxis.classList.toggle('hot', which === 'y');
    }
    pulse() {
      this.svg.classList.remove('pulse');
      void this.svg.getBoundingClientRect();
      this.svg.classList.add('pulse');
    }

    // ---------- overlays ----------
    banner(text, cls = '') {
      const t = svgEl('text', { x: this.W / 2, y: this.Y(8.2), 'text-anchor': 'middle', class: 'banner ' + cls }, this.layers.overlay);
      t.textContent = text;
      setTimeout(() => t.remove(), 1700);
      return t;
    }
    attempt(n) {
      this.layers.overlay.querySelectorAll('.attempt-pop').forEach(e => e.remove());
      const t = svgEl('text', { x: this.X(6.2), y: this.Y(-9.3), 'text-anchor': 'end', class: 'attempt-pop' }, this.layers.overlay);
      t.textContent = 'Attempt ' + n;
      setTimeout(() => t.remove(), 2200);
    }
    arrowFlash() {
      const g = svgEl('g', { class: 'arrow-flash' }, this.layers.overlay);
      const y = this.Y(9.1);
      svgEl('path', { d: `M${this.X(-4.6)} ${y}H${this.X(4.4)}M${this.X(3.7)} ${y - 9}L${this.X(4.5)} ${y}L${this.X(3.7)} ${y + 9}`, class: 'arrow' }, g);
      const t = svgEl('text', { x: this.W / 2, y: y - 14, 'text-anchor': 'middle', class: 'glabel big' }, g);
      t.textContent = 'READ LEFT → RIGHT';
      setTimeout(() => g.remove(), 2400);
    }
    fog(lines) {
      const g = svgEl('g', { class: 'fog' }, this.layers.overlay);
      svgEl('rect', { width: this.W, height: this.H }, g);
      lines.forEach((ln, i) => {
        const t = svgEl('text', { x: this.W / 2, y: this.H / 2 - 20 + i * 34, 'text-anchor': 'middle', class: i ? 'fog-sub' : 'fog-title' }, g);
        t.textContent = ln;
      });
      return g;
    }

    // ---------- the rider ----------
    showRiderAt(px, py, angle) {
      this.riderG.setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)}) rotate(${angle.toFixed(2)})`);
      this.riderG.setAttribute('visibility', 'visible');
    }
    hideRider() { this.riderG.setAttribute('visibility', 'hidden'); }
    // Rider waiting on y = mx + c at x (numbers).
    idleOnLine(m, c, x) {
      const clip = L.clipLine(m, c);
      if (!clip) return this.hideRider();
      const xx = clamp(x, clip[0].x, clip[1].x);
      this.showRiderAt(this.X(xx), this.Y(m * xx + c), Math.atan2(-m, 1) * 180 / Math.PI);
    }
    // Ride along a polyline of graph points, left to right. Resolves when the ride (and any wipeout) is over.
    ride(points, opts = {}) {
      const P = points.map(p => this.P(p));
      const Ls = [0];
      for (let i = 1; i < P.length; i++) Ls.push(Ls[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      const total = Ls[Ls.length - 1];
      const dur = REDUCED ? 0 : clamp(total / 0.36, total ? 600 : 0, 2300);
      const gates = (opts.gates || []).map(gt => ({ ...gt, px: this.X(gt.x) }));
      let lastAngle = opts.angle || 0;
      const at = s => {
        if (P.length === 1 || total === 0) return { x: P[0][0], y: P[0][1], a: lastAngle };
        let i = 0;
        while (i < P.length - 2 && Ls[i + 1] < s) i++;
        const seg = Ls[i + 1] - Ls[i] || 1, k = clamp((s - Ls[i]) / seg, 0, 1);
        const dx = P[i + 1][0] - P[i][0], dy = P[i + 1][1] - P[i][1];
        if (dx || dy) lastAngle = Math.atan2(dy, dx) * 180 / Math.PI;
        return { x: P[i][0] + dx * k, y: P[i][1] + dy * k, a: lastAngle };
      };
      if (P.length > 1) at(1e-6);
      const hist = [];
      this.trail.classList.remove('fade');
      const gen = this.gen;
      return new Promise(resolve => {
        const t0 = performance.now();
        const frame = now => {
          if (!this.svg.isConnected || gen !== this.gen) return resolve();
          const k = dur ? clamp((now - t0) / dur, 0, 1) : 1;
          const pos = at(k * total);
          this.showRiderAt(pos.x, pos.y, pos.a);
          hist.push([pos.x, pos.y]);
          if (hist.length > 16) hist.shift();
          this.trail.setAttribute('d', hist.length > 1 ? 'M' + hist.map(h => h[0].toFixed(1) + ' ' + h[1].toFixed(1)).join('L') : '');
          for (const gt of gates) {
            if (!gt.hit && pos.x >= gt.px - 0.5) { gt.hit = true; this.hitGate(gt); }
          }
          if (k < 1) { tick(frame); return; }
          this.trail.classList.add('fade');
          if (opts.crash) { this.hideRider(); this.shatter(pos.x, pos.y).then(resolve); }
          else {
            if (opts.burst !== false) this.burst(pos.x, pos.y, 10);
            if (opts.hideAtEnd) setTimeout(() => this.hideRider(), 300);
            wait(REDUCED ? 0 : 250).then(resolve);
          }
        };
        tick(frame);
      });
    }
    hitGate(gt) {
      if (gt.el) { gt.el.classList.remove('hit'); void gt.el.getBoundingClientRect(); gt.el.classList.add('hit'); }
      this.burst(this.X(gt.x), this.Y(gt.y), 6);
    }
    burst(px, py, n) { this.particles(px, py, REDUCED ? 0 : n, 0.6, 140); }
    shatter(px, py) {
      const ring = svgEl('circle', { cx: px, cy: py, r: 6, class: 'boom' }, this.layers.fx);
      setTimeout(() => ring.remove(), 700);
      return this.particles(px, py, REDUCED ? 0 : 18, 1.0, 230);
    }
    particles(px, py, n, life, speed) {
      const g = svgEl('g', null, this.layers.fx);
      const parts = [];
      for (let i = 0; i < n; i++) {
        const size = 4 + Math.random() * (speed > 200 ? 8 : 4);
        const ang = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random() * 0.8);
        const r = svgEl('rect', { x: -size / 2, y: -size / 2, width: size, height: size, fill: SHARDS[i % SHARDS.length], class: 'shard' }, g);
        parts.push({ r, x: px, y: py, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - speed * 0.5, rot: Math.random() * 360, vr: (Math.random() - 0.5) * 720 });
      }
      return new Promise(resolve => {
        if (!n) { g.remove(); resolve(); return; }
        const t0 = performance.now();
        let last = t0;
        const frame = now => {
          const dt = Math.min(0.05, (now - last) / 1000), age = (now - t0) / 1000;
          last = now;
          for (const p of parts) {
            p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
            p.r.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)})`);
            p.r.setAttribute('opacity', Math.max(0, 1 - age / life).toFixed(2));
          }
          if (age < life && this.svg.isConnected) tick(frame);
          else { g.remove(); resolve(); }
        };
        tick(frame);
      });
    }

    // ---------- input ----------
    bindPointer() {
      const s = this.svg;
      s.addEventListener('pointermove', e => {
        if (this.drag) { this.tryMove(this.drag, this.snap(this.toGraph(e))); return; }
        if (!this.tapFn || e.pointerType === 'touch') return;
        const p = this.snap(this.toGraph(e));
        this.hoverRing.setAttribute('cx', this.X(p.x));
        this.hoverRing.setAttribute('cy', this.Y(p.y));
        this.hoverRing.setAttribute('visibility', 'visible');
        if (this.showCoords) {
          // "(x, y)" beside the ring, flipped to stay inside the grid near the right and top edges.
          const right = p.x <= 3, below = p.y >= 9;
          this.hoverText.textContent = `(${L.fmt(p.x)}, ${L.fmt(p.y)})`;
          this.hoverText.setAttribute('x', this.X(p.x) + (right ? 16 : -16));
          this.hoverText.setAttribute('y', this.Y(p.y) + (below ? 24 : -12));
          this.hoverText.setAttribute('text-anchor', right ? 'start' : 'end');
          this.hoverText.setAttribute('visibility', 'visible');
        }
      });
      s.addEventListener('pointerleave', () => {
        this.hoverRing.setAttribute('visibility', 'hidden');
        this.hoverText.setAttribute('visibility', 'hidden');
      });
      const end = () => {
        if (!this.drag) return;
        this.drag.g.classList.remove('dragging');
        this.drag = null;
        this.dragEndedAt = performance.now();
      };
      s.addEventListener('pointerup', end);
      s.addEventListener('pointercancel', end);
      s.addEventListener('click', e => {
        if (performance.now() - this.dragEndedAt < 250) return;
        if (!this.tapFn) return;
        const raw = this.toGraph(e);
        this.tapFn(this.snap(raw), raw);
      });
    }
    toGraph(e) {
      const pt = this.svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(this.svg.getScreenCTM().inverse());
      return { x: q.x / this.U + this.xmin, y: this.ymax - q.y / this.U };
    }
    snap(p) { return { x: clamp(Math.round(p.x), -6, 6), y: clamp(Math.round(p.y), -10, 10) }; }
    // opts.coords: show the "(x, y)" of the point under the pointer.
    setTap(fn, opts = {}) {
      this.showCoords = !!(fn && opts.coords);
      this.hoverText.setAttribute('visibility', 'hidden');
      this.tapFn = fn;
      this.svg.classList.toggle('tappable', !!fn);
      if (!fn) this.hoverRing.setAttribute('visibility', 'hidden');
    }
    // A draggable knob that snaps to whole-number points. opts: constrain(q, current) -> point|null, onMove(p), cls, label
    handle(p, opts = {}) {
      const g = svgEl('g', { class: 'handle ' + (opts.cls || ''), tabindex: 0, role: 'button', 'aria-label': opts.label || 'Drag handle. Use the arrow keys to move it.' }, this.layers.handles);
      svgEl('circle', { r: 24, class: 'hit' }, g);
      svgEl('circle', { r: 11, class: 'knob' }, g);
      const h = { g, p: null, opts, locked: false };
      h.set = q => { h.p = { x: q.x, y: q.y }; g.setAttribute('transform', `translate(${this.X(q.x)} ${this.Y(q.y)})`); };
      h.set(p);
      g.addEventListener('pointerdown', e => {
        if (h.locked) return;
        e.preventDefault();
        e.stopPropagation();
        this.drag = h;
        try { this.svg.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
        g.classList.add('dragging');
      });
      g.addEventListener('keydown', e => {
        const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
        if (!dir || h.locked) return;
        e.preventDefault();
        this.tryMove(h, { x: h.p.x + dir[0], y: h.p.y + dir[1] });
      });
      this.handles.push(h);
      return h;
    }
    tryMove(h, q) {
      if (h.locked) return;
      q = this.snap(q);
      if (h.opts.constrain) q = h.opts.constrain(q, h.p);
      if (!q || (q.x === h.p.x && q.y === h.p.y)) return;
      h.set(q);
      if (h.opts.onMove) h.opts.onMove(h.p);
    }
    lockHandles(on) {
      for (const h of this.handles) { h.locked = on; h.g.classList.toggle('locked', on); }
    }
  }

  window.Graph = Graph;
  window.SRFX = { REDUCED, wait, clamp, svgEl };
})();

</script>
<script>

  function runStats(id) {

  }
  const TEACHER = /teacher/i.test(location.hash);

  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const eq = s => `<span class="eq">${s}</span>`;
  const pt = p => `(${fmt(p.x)}, ${fmt(p.y)})`;
  const sgn = c => (c ? L.signed(c) : '');
  // A fraction as a student would type it: 3, −2, 1/2, −3/4

  const sd = d => (d > 0 ? '+' + d : fmt(d));
  // y = 3x − 2 in words: "multiply x by 3, then subtract 2"
  function ruleWords(m, c) {
    const first = m === 1 ? 'start with x' : m === -1 ? 'multiply x by −1' : `multiply x by ${fmt(m)}`;
    return c > 0 ? `${first}, then add ${c}` : c < 0 ? `${first}, then subtract ${-c}` : first;
  }
  const clampY = y => Math.max(-10.6, Math.min(10.6, y));

  const CHEERS = ['Clean run!', 'Sick line!', 'Nailed it!', 'Smooth!', 'Shredding!', 'Stomped it!'];
  const cheer = () => CHEERS[Math.floor(Math.random() * CHEERS.length)];
  const INVALID_MSG = 'Type a whole number or a fraction, like 3, −2 or 3/4.';
  const ROUNDED_MSG = 'So close! Use a fraction instead of a rounded decimal: 1/3, not 0.33.';
  const MIXED_MSG = 'Write it as a top-heavy fraction instead of a mixed number: 3/2, not 1 1/2.';

  class Session {
    constructor(parent) {
      this.dead = false;
      this.killP = new Promise((_, rej) => { this.kill = () => { if (!this.dead) { this.dead = true; rej(CANCEL); } }; });
      this.killP.catch(() => {});
      if (parent) parent.killP.catch(() => this.kill());
    }
    wait(p) { return Promise.race([p, this.killP]); }
  }

  // ---------- panel ----------
  class Panel {
    constructor(el, session) { this.el = el; this.session = session; }
    layout(kind, meta) {
      this.el.innerHTML = `
        <div class="phead"><span class="pill ${kind.toLowerCase()}">${kind}</span><span class="pmeta">${meta || ''}</span><span class="pextra"></span><button class="help-btn" type="button" aria-label="How do I answer this?" title="How do I answer this?" hidden>?</button></div>
        <div class="coach"><div class="avatar" aria-hidden="true"><svg viewBox="-4 2 108 96"><use href="#rider"/></svg></div><div class="bubble"></div></div>
        <div class="work"></div>
        <div class="fb" role="status" aria-live="polite"></div>
        <div class="hintbox" hidden></div>
        <div class="actions"></div>`;
      const q = s => this.el.querySelector(s);
      this.meta = q('.pmeta'); this.extra = q('.pextra'); this.bubble = q('.bubble'); this.work = q('.work');
      this.helpBtn = q('.help-btn');
      this.fbEl = q('.fb'); this.hintEl = q('.hintbox'); this.actions = q('.actions');
      this.el.scrollTop = 0;
    }
    setMeta(t) { this.meta.textContent = t; }
    // Show the ? button for a walkthrough in HELP.
    setHelp(key) {
      this.helpBtn.hidden = !HELP[key];
      this.helpBtn.onclick = () => showHelp(key);
    }
    say(html) { this.bubble.innerHTML = html; }
    feedback(html, kind) {
      this.fbEl.className = 'fb' + (kind ? ' ' + kind : '');
      this.fbEl.innerHTML = html || '';
      if (html) this.fbEl.scrollIntoView({ block: 'nearest' });
    }
    hint(level, html) {
      this.hintEl.hidden = false;
      this.hintEl.className = 'hintbox' + (level === 3 ? ' solution' : '');
      this.hintEl.innerHTML = `<div class="hint-label">${level === 3 ? 'How to work it out' : 'Hint ' + level + ' of 2'}</div><div class="hint-body">${html}</div>`;
      this.hintEl.scrollIntoView({ block: 'nearest' });
    }
    clearActions() { this.actions.innerHTML = ''; }
    button(label, cls) {
      const b = h(`<button class="btn ${cls || ''}" type="button">${label}</button>`);
      this.actions.appendChild(b);
      return b;
    }
    waitButton(label, cls) {
      this.clearActions();
      const b = this.button(label, cls);
      b.scrollIntoView({ block: 'nearest' });
      setTimeout(() => { if (b.isConnected) b.focus({ preventScroll: true }); }, 60);
      return this.session.wait(new Promise(res => b.addEventListener('click', () => res(), { once: true })));
    }
  }

  // ---------- widgets ----------
  function markInput(inp, ok) {
    inp.classList.remove('ok', 'bad');
    void inp.offsetWidth;
    inp.classList.add(ok ? 'ok' : 'bad');
  }
  function makeInput(aria) {
    const inp = h(`<input class="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(aria)}">`);
    inp.addEventListener('input', () => inp.classList.remove('bad', 'ok'));
    return inp;
  }
  function numField(parent, pre, post, aria) {
    const row = h(`<label class="numrow"><span class="pre">${pre}</span><span class="post">${post || ''}</span></label>`);
    const inp = makeInput(aria || pre.replace(/<[^>]+>/g, ''));
    row.insertBefore(inp, row.querySelector('.post'));
    parent.appendChild(row);
    return inp;
  }
  function eqField(parent) {
    const row = h('<div class="eqw"><span>y =</span><span class="slot-m"></span><span>x +</span><span class="slot-c"></span></div>');
    const m = makeInput('gradient m'), c = makeInput('y-intercept c');
    row.querySelector('.slot-m').replaceWith(m);
    row.querySelector('.slot-c').replaceWith(c);
    parent.appendChild(row);
    parent.appendChild(h('<p class="tip">Fill in both boxes. Type 1 for plain x, and 0 if there is no number on the end. Negative? Type a minus: −3 or −1/2.</p>'));
    return { m, c, lock(on) { m.disabled = on; c.disabled = on; } };
  }
  // A table of values. Columns alternate value / gap so difference bubbles sit between the values.
  function tableWidget(parent, o) {
    const n = o.xs.length;
    const cols = `2.4rem repeat(${n - 1}, minmax(2.5rem, 1fr) minmax(1.7rem, .62fr)) minmax(2.5rem, 1fr)`;
    const el = h(`<div class="tbl" style="grid-template-columns:${cols}"></div>`);
    const at = (r, c) => `grid-row:${r};grid-column:${c}`;
    el.appendChild(h(`<div class="th" style="${at(1, 1)}">x</div>`));
    el.appendChild(h(`<div class="th" style="${at(2, 1)}">y</div>`));
    const xCells = o.xs.map((x, i) => el.appendChild(h(`<div class="cell xc" style="${at(1, 2 + 2 * i)}">${fmt(x)}</div>`)));
    const yInputs = [], dInputs = [];
    const yCells = o.ys.map((y, i) => {
      const cell = h(`<div class="cell yc" style="${at(2, 2 + 2 * i)}"></div>`);
      if (o.editY) { const inp = makeInput(`${o.label ? o.label + ': ' : ''}y when x is ${fmt(o.xs[i])}`); cell.appendChild(inp); yInputs.push(inp); }
      else cell.textContent = fmt(y);
      return el.appendChild(cell);
    });
    const dCells = [];
    if (o.diffs) {
      el.appendChild(h(`<div class="th small" style="${at(3, 1)}">diff</div>`));
      for (let i = 0; i < n - 1; i++) {
        const cell = h(`<div class="cell dc" style="${at(3, 3 + 2 * i)}"></div>`);
        if (o.diffs === 'edit') { const inp = makeInput(`difference from x = ${fmt(o.xs[i])} to x = ${fmt(o.xs[i + 1])}`); cell.appendChild(inp); dInputs.push(inp); }
        dCells.push(el.appendChild(cell));
      }
    }
    parent.appendChild(el);
    return {
      el, yInputs, dInputs,
      colState(i, s) {
        for (const c of [xCells[i], yCells[i]]) { c.classList.remove('ok', 'bad', 'hl'); if (s) c.classList.add(s); }
      },
      showDiff(i, text, cls) { dCells[i].innerHTML = `<span class="dbub ${cls || ''}">${text}</span>`; },
      lock(on) { for (const inp of [...yInputs, ...dInputs]) inp.disabled = on; }
    };
  }

  // ---------- shared ride helpers ----------
  function gateFlags(g, points, cls = 'gate') { return points.map(p => ({ x: p.x, y: p.y, el: g.flag(p.x, p.y, cls) })); }
  function letterFlag(g, p, letter) {
    const left = p.x >= 3;
    g.label(p.x, p.y, `${letter} ${pt(p)}`, { dx: left ? -8 : 20, dy: left ? -30 : -18, anchor: left ? 'end' : 'start', cls: 'gate-letter' });
  }
  // The rider rides the student's line and wipes out at the first gate it misses.
  async function rideStudent(g, m, c, gates) {
    const mv = qval(m), cv = qval(c);
    g.line(mv, cv, { cls: 'student', layer: 'scratch' });
    const sorted = gates.slice().sort((a, b) => a.x - b.x);
    const onIt = gt => Math.abs(mv * gt.x + cv - gt.y) < 1e-9;
    const missed = sorted.find(gt => !onIt(gt));
    const endX = missed ? missed.x : 6;
    // A line that never enters the grid wipes out at the grid edge, never on a true gate.
    const edgeX = missed ? missed.x : -6;
    const path = L.pathTo(mv, cv, endX) || [{ x: edgeX, y: clampY(mv * edgeX + cv) }];
    await g.ride(path, { crash: !!missed, gates: sorted.filter(gt => gt.x < endX && onIt(gt)) });
  }
  function rideTrue(g, m, c, gates, opts) {
    return g.ride(L.clipLine(qval(m), qval(c)), Object.assign({ gates }, opts));
  }
  const ISSUE_TEXT = {
    height: 'Wrong height: you missed the Base Station.',
    direction: 'Wrong way! Read the run from left to right.',
    flat: 'Your run is flat (m = 0), but this one climbs or drops.',
    steep: 'Too steep.',
    shallow: 'Not steep enough.'
  };
  function lineMsg(issues, noMap) {
    return issues.map(i => (i === 'height' && noMap ? 'Wrong height: your c is off, so the run misses the gates.' : ISSUE_TEXT[i])).join(' ');
  }
  function slopeMsg(mAns, m) {
    if (mAns.n === 0) return `A flat run has m = 0, but this one goes ${m.n > 0 ? 'up' : 'down'}.`;
    if (Math.sign(mAns.n) !== Math.sign(m.n)) return `Wrong way! You rode a ${mAns.n > 0 ? 'lift up' : 'run down'}, but reading left to right this one goes ${m.n > 0 ? 'up' : 'down'}.`;
    return Math.abs(qval(mAns)) > Math.abs(qval(m)) ? 'Too steep! Your line climbs or drops faster than the run.' : 'Not steep enough! Your line is flatter than the run.';
  }
  // What was wrong with the student's last y = mx + c, said in terms of the dashed line they rode.
  function eqMistake(ans, d) {
    if (!ans || ans.status === 'invalid') return '';
    const out = [];
    if (!qeq(ans.m, d.m)) {
      const mine = qpretty(ans.m);
      if (ans.m.n === 0) out.push(`You had m = 0, a flat line, but this run goes ${d.m.n > 0 ? 'up' : 'down'}.`);
      else if (L.qsign(ans.m) !== L.qsign(d.m)) out.push(`You had m = ${mine}, which goes ${ans.m.n > 0 ? 'up' : 'down'} from left to right, but this run goes ${d.m.n > 0 ? 'up' : 'down'}.`);
      else out.push(`You had m = ${mine}, so your dashed line is ${Math.abs(qval(ans.m)) < Math.abs(qval(d.m)) ? 'flatter' : 'steeper'} than the run.`);
    }
    if (!qeq(ans.c, d.c)) out.push(`You had c = ${qpretty(ans.c)}, so your line crosses the y-axis at (0, ${qpretty(ans.c)}) instead of (0, ${fmt(d.c.n)}).`);
    return out.length ? `<p class="mistake"><b>Your answer:</b> ${out.join(' ')}</p>` : '';
  }
  // Rise and run between two points, in words a student would say while counting squares.
  function countSteps(P1, P2) {
    const run = P2.x - P1.x, rise = P2.y - P1.y;
    const riseText = rise > 0
      ? `From ${fmt(P1.y)} up to ${fmt(P2.y)} is <b>up ${rise}</b>, so rise = ${rise}.`
      : `From ${fmt(P1.y)} down to ${fmt(P2.y)} is <b>down ${-rise}</b>. Down means negative, so rise = ${fmt(rise)}.`;
    return [
      `<b>Count the run.</b> Going left to right from ${pt(P1)} to ${pt(P2)} is <b>${run} across</b>, so run = ${run}.`,
      `<b>Count the rise.</b> ${riseText}`,
      `<b>Work out m.</b> m = rise ÷ run = ${fmt(rise)} ÷ ${run} = <b>${qpretty(Q(rise, run))}</b>.${rise % run ? ' It does not divide exactly, so leave it as a fraction.' : ''}`
    ];
  }
  function stepList(items) { return `<ol class="steps">${items.map(s => `<li>${s}</li>`).join('')}</ol>`; }
  // Check the equation at a point on the run: y = m × x + c.
  const checkStep = (d, P) => `<b>Check it.</b> At x = ${fmt(P.x)}: y = ${qpretty(d.m)} × ${paren(P.x)}${d.c.n ? ` ${d.c.n < 0 ? '−' : '+'} ${Math.abs(d.c.n)}` : ''} = ${fmt(P.y)}. The point ${pt(P)} is on the run ✓`;

  // Read a list of number inputs. Returns { status } or { status: 'ok', vals }.
  function readNums(inputs, emptyMsg, expected) {
    const ps = inputs.map(i => L.parseNum(i.value));
    if (ps.some(p => p.empty)) return { status: 'empty', msg: emptyMsg };
    if (ps.some(p => p.mixed)) return { status: 'invalid', msg: MIXED_MSG };
    if (ps.some(p => p.invalid)) return { status: 'invalid', msg: INVALID_MSG };
    if (expected) {
      for (let i = 0; i < ps.length; i++) {
        if (expected[i] && L.judgeNum(inputs[i].value, expected[i]).status === 'rounded') return { status: 'rounded', msg: ROUNDED_MSG };
      }
    }
    return { status: 'ok', vals: ps.map(p => p.q) };
  }

  // =====================================================================
  // Question types. Each has: say, mount(ctx), read(), check(), play(res), hint(level), solve(), lock(on)
  // =====================================================================

  // Run 1: plant a flag for every pair.
  function qPlot(d) {
    const pts = d.points, n = pts.length, m = qval(d.m), c = qval(d.c);
    let placed = [], tw, counter, locked = false, g, panel;
    const isRight = p => pts.some(q => q.x === p.x && q.y === p.y);
    const update = () => { counter.innerHTML = `Flags planted: <b>${placed.length}</b> of ${n}`; };
    return {
      key: 'plot' + JSON.stringify(pts),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say('Plant a flag for every pair in the table. <b>Tap the grid</b> to plant one. Tap a flag again to pull it out.');
        tw = tableWidget(panel.work, { xs: pts.map(p => p.x), ys: pts.map(p => p.y) });
        counter = panel.work.appendChild(h('<p class="counter"></p>'));
        update();
        g.setTap((p, raw) => {
          if (locked) return;
          let i = placed.findIndex(f => f.x === p.x && f.y === p.y);
          // The flag's cloth sits above its point, so a tap on the cloth counts as a tap on that flag.
          const onPoint = Math.hypot(raw.x - p.x, raw.y - p.y) < 0.3;
          if (i < 0 && !onPoint) i = placed.findIndex(f => Math.abs(raw.x - f.x) < 0.65 && raw.y - f.y > 0.2 && raw.y - f.y < 0.9);
          if (i >= 0) { placed[i].el.remove(); placed.splice(i, 1); }
          else if (placed.length >= n) { panel.feedback(`That's ${n} flags already. Tap a flag to pull it out first.`, 'info'); return; }
          else placed.push({ x: p.x, y: p.y, el: g.flag(p.x, p.y, 'mine') });
          update();
        }, { coords: true });
      },
      read() { return placed.length < n ? { status: 'empty', msg: `Plant all ${n} flags first. You have ${placed.length}.` } : { status: 'ok' }; },
      check() {
        const r = L.checkPlot(placed, pts), k = r.wrong.length;
        return { correct: r.correct, msg: k === 1 ? 'One flag is in the wrong place.' : `${k} flags are in the wrong place.` };
      },
      async play(res) {
        const sorted = placed.slice().sort((a, b) => a.x - b.x || a.y - b.y);
        if (res.correct) {
          g.line(m, c);
          sorted.forEach(f => f.el.setAttribute('class', 'flag ok'));
          pts.forEach((p, i) => tw.colState(i, 'ok'));
          await g.ride(L.clipLine(m, c), { gates: sorted });
          return;
        }
        const idx = sorted.findIndex(f => !isRight(f));
        await g.ride(sorted.slice(0, idx + 1), { crash: true, gates: sorted.slice(0, idx) });
        placed.filter(f => !isRight(f)).forEach(f => g.dropFlag(f.el));
        placed = placed.filter(isRight);
        pts.forEach((p, i) => tw.colState(i, placed.some(f => f.x === p.x && f.y === p.y) ? 'ok' : 'bad'));
        update();
      },
      hint(level) {
        if (level === 1) return 'Find <b>x</b> first: go <b>across</b> to it on the x-axis. Then find <b>y</b>: go <b>up</b> if it is positive, <b>down</b> if it is negative.';
        const i = pts.findIndex(p => !placed.some(f => f.x === p.x && f.y === p.y));
        const p = pts[i];
        tw.colState(i, 'hl');
        g.clearLayer('guides');
        g.guide([{ x: 0, y: 0 }, { x: p.x, y: 0 }, { x: p.x, y: p.y }]);
        g.dot(p.x, p.y, { cls: 'hint-dot', layer: 'guides' });
        const across = p.x === 0 ? 'stay at 0 across' : `go ${p.x > 0 ? 'right' : 'left'} ${Math.abs(p.x)}`;
        const updown = p.y === 0 ? 'stay on the x-axis' : `go ${p.y > 0 ? 'up' : 'down'} ${Math.abs(p.y)}`;
        return `Try the pair x = ${fmt(p.x)}, y = ${fmt(p.y)}. Start at 0, ${across}, then ${updown}. Follow the dotted path.`;
      },
      solve() {
        placed.forEach(f => f.el.remove());
        placed = [];
        g.clearLayer('guides');
        g.line(m, c, { cls: 'ghost-line' });
        pts.forEach(p => g.flag(p.x, p.y, 'ghost'));
        pts.forEach((p, i) => tw.colState(i, null));
        update();
        return `Here is where every flag goes. They line up on ${eq(eqStr(d.m, d.c))}.`;
      },
      lock(on) { locked = on; }
    };
  }

  // Run 2: fill in a table of values.
  function qFill(d) {
    const { xs, ys } = d, mN = d.m.n, cN = d.c.n;
    let tw, g, panel, vals, lastWrong = [];
    return {
      key: 'fill' + mN + ',' + cN + ',' + xs[0],
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say(`The rule is ${eq(eqStr(d.m, d.c))}. For each <b>x</b> in the table, ${ruleWords(mN, cN)} to get <b>y</b>. Fill in every y.`);
        panel.setHelp('fill');
        tw = tableWidget(panel.work, { xs, ys, editY: true });
        setTimeout(() => tw.yInputs[0].focus({ preventScroll: true }), 80);
      },
      read() { const r = readNums(tw.yInputs, 'Fill in every y value.'); if (r.vals) vals = r.vals; return r; },
      check() {
        lastWrong = [];
        vals.forEach((v, i) => { const ok = qeq(v, Q(ys[i])); markInput(tw.yInputs[i], ok); if (!ok) lastWrong.push(i); });
        return { correct: !lastWrong.length, wrong: lastWrong, msg: lastWrong.length === 1 ? 'One y value is off.' : `${lastWrong.length} y values are off.` };
      },
      async play(res) {
        g.clearLayer('marks');
        const pts = xs.map((x, i) => ({ x, y: qval(vals[i]) }));
        if (res.correct) {
          g.line(mN, cN);
          await g.ride(L.clipLine(mN, cN), { gates: gateFlags(g, pts) });
          return;
        }
        pts.forEach((p, i) => g.flag(p.x, p.y, res.wrong.includes(i) ? 'bad' : 'mine'));
        await g.ride(pts.slice(0, res.wrong[0] + 1).map(p => ({ x: p.x, y: clampY(p.y) })), { crash: true });
      },
      hint(level) {
        if (level === 1) return cN ? `Swap each x into the rule: y = ${fmt(mN)} × x${sgn(cN)}. Multiply first, then ${cN < 0 ? 'subtract' : 'add'}.` : `Swap each x into the rule: y = ${fmt(mN)} × x. Multiply each x by ${fmt(mN)}.`;
        const i = lastWrong[0], x = xs[i];
        tw.colState(i, 'hl');
        return cN ? `When x = ${fmt(x)}: y = ${fmt(mN)} × ${paren(x)}${sgn(cN)} = ${fmt(mN * x)}${sgn(cN)} = ${fmt(ys[i])}.` : `When x = ${fmt(x)}: y = ${fmt(mN)} × ${paren(x)} = ${fmt(ys[i])}.`;
      },
      solve() {
        tw.yInputs.forEach((inp, i) => { inp.value = fmt(ys[i]); markInput(inp, true); });
        return `Each y goes ${mN > 0 ? 'up' : 'down'} by ${Math.abs(mN)} as x goes up by 1. That jump is the gradient of ${eq(eqStr(d.m, d.c))}.`;
      },
      lock(on) { tw.lock(on); }
    };
  }

  // Run 2: read the difference and the y-intercept from a table.
  function qRead(d) {
    const { xs, ys } = d, diff = d.m.n, c0 = d.c.n;
    let tw, g, panel, dInp, cInp, vals, okD, okC;
    return {
      key: 'read' + diff + ',' + c0 + ',' + xs[0],
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say('Read the table. What is the <b>1st common difference</b> (how much y goes up or down each step), and what is <b>y when x = 0</b>?');
        panel.setHelp('read');
        tw = tableWidget(panel.work, { xs, ys, diffs: 'show' });
        dInp = numField(panel.work, '1st common difference =', '', '1st common difference');
        cInp = numField(panel.work, 'When x = 0, y =', '', 'y when x is 0');
      },
      read() { const r = readNums([dInp, cInp], 'Fill in both boxes.'); if (r.vals) vals = r.vals; return r; },
      check() {
        okD = qeq(vals[0], d.m); okC = qeq(vals[1], d.c);
        markInput(dInp, okD); markInput(cInp, okC);
        return { correct: okD && okC, msg: !okD && !okC ? 'Both boxes need another look.' : (!okD ? 'Check the difference.' : 'Check y when x = 0.') };
      },
      async play(res) {
        g.clearLayer('scratch'); g.clearLayer('marks');
        const gates = gateFlags(g, xs.map((x, i) => ({ x, y: ys[i] })));
        if (res.correct) { g.line(diff, c0); await rideTrue(g, d.m, d.c, gates); return; }
        await rideStudent(g, vals[0], vals[1], gates);
      },
      hint(level) {
        if (level === 1) return 'Subtract each y from the next one: that is the <b>1st common difference</b>. For y when x = 0, find <b>0</b> in the x row.';
        tw.showDiff(0, sd(ys[1] - ys[0]), 'hint');
        tw.colState(xs.indexOf(0), 'hl');
        return `${fmt(ys[1])} − ${paren(ys[0])} = ${fmt(ys[1] - ys[0])}. Is it the same all the way along? The highlighted column is x = 0.`;
      },
      solve() {
        L.diffsOf(ys).forEach((v, i) => tw.showDiff(i, sd(v)));
        dInp.value = fmt(diff); cInp.value = fmt(c0); markInput(dInp, true); markInput(cInp, true);
        return `The difference is ${fmt(diff)} every time, and y = ${fmt(c0)} when x = 0. So the run is ${eq(eqStr(d.m, d.c))}.`;
      },
      lock(on) { dInp.disabled = on; cInp.disabled = on; }
    };
  }

  // Run 2: is it a straight run?
  function qStraight(d) {
    const { xs, ys, diffs, linear } = d;
    let tw, g, panel, vals, verdict = null, btns, lastWrong = [];
    return {
      key: 'straight' + ys.join(','),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say('Is this a <b>straight run</b>? Work out how much y changes each step (the differences), then decide.');
        panel.setHelp('straight');
        tw = tableWidget(panel.work, { xs, ys, diffs: 'edit' });
        const row = panel.work.appendChild(h('<div class="verdict" role="group" aria-label="Your verdict"><button type="button" class="toggle" data-v="straight">Straight run</button><button type="button" class="toggle" data-v="not">Not straight</button></div>'));
        btns = [...row.querySelectorAll('.toggle')];
        btns.forEach(b => b.addEventListener('click', () => {
          verdict = b.dataset.v;
          btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        }));
        btns.forEach(b => b.setAttribute('aria-pressed', 'false'));
      },
      read() {
        const r = readNums(tw.dInputs, 'Fill in every difference.');
        if (r.status !== 'ok') return r;
        if (!verdict) return { status: 'empty', msg: 'Choose <b>Straight run</b> or <b>Not straight</b>.' };
        vals = r.vals;
        return r;
      },
      check() {
        lastWrong = [];
        vals.forEach((v, i) => { const ok = qeq(v, Q(diffs[i])); markInput(tw.dInputs[i], ok); if (!ok) lastWrong.push(i); });
        const vOk = (verdict === 'straight') === linear;
        const msg = lastWrong.length ? 'Check your differences.' : (linear ? 'Your differences are all the same. What does that tell you?' : 'Your differences are not all the same. What does that tell you?');
        return { correct: !lastWrong.length && vOk, wrong: lastWrong, msg };
      },
      async play(res) {
        g.clearLayer('marks'); g.clearLayer('lines');
        const pts = xs.map((x, i) => ({ x, y: ys[i] }));
        const gates = gateFlags(g, pts);
        if (res.correct) {
          if (linear) { g.line(d.m.n, d.c.n); await rideTrue(g, d.m, d.c, gates); }
          else {
            const f = { square: x => x * x + d.k, negsquare: x => -x * x + d.k, power: x => Math.pow(2, x) - d.k }[d.kind];
            const path = f ? sample(f, xs[0], xs[xs.length - 1]) : pts;
            g.polyline(path, { cls: 'run-line mogul' });
            g.banner('MOGULS!', 'warn');
            await g.ride(path, { gates });
          }
          return;
        }
        let idx;
        if (res.wrong.length) idx = res.wrong[0] + 1;
        else if (linear) idx = pts.length - 1;
        else idx = diffs.findIndex(v => v !== diffs[0]) + 1;
        await g.ride(pts.slice(0, idx + 1), { crash: true, gates: gates.slice(0, idx) });
      },
      hint(level) {
        if (level === 1) return 'Subtract each y from the next one. A straight run has the <b>same</b> difference every time.';
        if (!lastWrong.length) return `Your differences are ${diffs.map(fmt).join(', ')}. A straight run has the <b>same</b> difference every time. Are yours all the same?`;
        const i = lastWrong[0];
        tw.dInputs[i].value = fmt(diffs[i]);
        markInput(tw.dInputs[i], true);
        return `${fmt(ys[i + 1])} − ${paren(ys[i])} = ${fmt(diffs[i])}. I filled that one in. Do the rest the same way, then compare them.`;
      },
      solve() {
        tw.dInputs.forEach((inp, i) => { inp.value = fmt(diffs[i]); markInput(inp, true); });
        verdict = linear ? 'straight' : 'not';
        btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === verdict)));
        return linear
          ? `Every difference is ${fmt(diffs[0])}, so it is a <b>straight run</b>.`
          : `The differences are ${diffs.map(fmt).join(', ')}. They change, so it is <b>not straight</b>.`;
      },
      lock(on) { tw.lock(on); btns.forEach(b => { b.disabled = on; }); }
    };
  }

  // Run 3: intercepts and reading values.
  function qBlue(d) {
    const mN = d.m.n, cN = d.c.n, type = d.type, T = d.target;
    const isTap = type === 'tapY' || type === 'tapX';
    const name = type === 'tapY' ? 'BASE STATION' : 'SNOW LINE';
    let g, panel, pick = null, marker = null, pickText, inp, val, locked = false;
    const SAY = {
      tapY: 'Tap the <b>Base Station</b>: the point where the run crosses the <b>y-axis</b>.',
      tapX: 'Tap the <b>Snow Line</b>: the point where the run crosses the <b>x-axis</b>.',
      xToY: `Read the mountain. When <b>x = ${fmt(d.given)}</b>, what is <b>y</b>?`,
      yToX: `Read the mountain. When <b>y = ${fmt(d.given)}</b>, what is <b>x</b>?`
    };
    return {
      key: type + mN + ',' + cN + ',' + (d.given ?? ''),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say(SAY[type]);
        g.line(mN, cN);
        g.idleOnLine(mN, cN, -5.3);
        if (isTap) {
          pickText = panel.work.appendChild(h('<p class="counter">Your pick: <b>none yet</b></p>'));
          g.setTap(p => {
            if (locked) return;
            pick = p;
            if (marker) marker.remove();
            marker = g.dot(p.x, p.y, { cls: 'pick', r: 8 });
            pickText.innerHTML = `Your pick: <b>${pt(p)}</b>`;
          });
        } else {
          inp = numField(panel.work, type === 'xToY' ? 'y =' : 'x =', '', type === 'xToY' ? 'y' : 'x');
          setTimeout(() => inp.focus({ preventScroll: true }), 80);
        }
      },
      read() {
        if (isTap) return pick ? { status: 'ok' } : { status: 'empty', msg: 'Tap a point on the grid first.' };
        const r = readNums([inp], 'Type your answer first.');
        if (r.vals) val = r.vals[0];
        return r;
      },
      check() {
        if (isTap) {
          const other = type === 'tapY' ? { x: d.xInt, y: 0 } : { x: 0, y: cN };
          const swapped = pick.x === other.x && pick.y === other.y;
          return { correct: pick.x === T.x && pick.y === T.y, msg: swapped ? `Missed the lift! That point is on the ${type === 'tapY' ? 'x' : 'y'}-axis.` : 'Missed the lift!' };
        }
        const ok = qeq(val, Q(d.answer));
        markInput(inp, ok);
        return { correct: ok, msg: 'Not that point. Missed the lift!' };
      },
      async play(res) {
        g.clearLayer('scratch');
        if (res.correct) {
          await g.ride(L.pathTo(mN, cN, T.x), { burst: true });
          if (isTap) { if (marker) marker.remove(); g.station(T, name, { cls: type === 'tapY' ? 'cyan' : 'yellow' }); }
          else g.flag(T.x, T.y, 'ok');
          return;
        }
        // The rider heads for the student's point and wipes out there, so it never lands on the answer.
        let P;
        if (isTap) { P = pick; marker.setAttribute('class', 'dot pick bad'); }
        else if (type === 'xToY') { P = { x: d.given, y: clampY(qval(val)) }; g.dot(P.x, P.y, { cls: 'pick bad', r: 7, layer: 'scratch' }); }
        else { P = { x: Math.max(-6.6, Math.min(6.6, qval(val))), y: d.given }; g.dot(P.x, P.y, { cls: 'pick bad', r: 7, layer: 'scratch' }); }
        const path = L.pathTo(mN, cN, P.x - 1) || [];
        await g.ride(path.concat([{ x: P.x, y: P.y }]), { crash: true });
      },
      hint(level) {
        if (level === 1) {
          return {
            tapY: 'The Base Station is where the run crosses the <b>y-axis</b>, the up-and-down axis.',
            tapX: 'The Snow Line is where the run crosses the <b>x-axis</b>, the across axis.',
            xToY: `Go across to x = ${fmt(d.given)} on the x-axis, then go up or down until you hit the run.`,
            yToX: `Find y = ${fmt(d.given)} on the y-axis, then go across until you hit the run.`
          }[type];
        }
        if (type === 'tapY') { g.axisHot('y'); return 'The glowing line is the y-axis. Where does the run touch it?'; }
        if (type === 'tapX') { g.axisHot('x'); return 'The glowing line is the x-axis. Where does the run touch it?'; }
        if (type === 'xToY') { g.guide([{ x: T.x, y: 0 }, T]); return 'Follow the dotted line to the run. Now read across to the y-axis.'; }
        g.guide([{ x: 0, y: T.y }, T]);
        return 'Follow the dotted line to the run. Now read down (or up) to the x-axis.';
      },
      solve() {
        if (isTap) { if (marker) marker.remove(); g.station(T, name, { cls: type === 'tapY' ? 'cyan' : 'yellow' }); return `The ${type === 'tapY' ? 'Base Station' : 'Snow Line'} is at ${pt(T)}.`; }
        g.clearLayer('guides');
        g.guide(type === 'xToY' ? [{ x: T.x, y: 0 }, T, { x: 0, y: T.y }] : [{ x: 0, y: T.y }, T, { x: T.x, y: 0 }]);
        g.flag(T.x, T.y, 'ghost');
        inp.value = fmt(d.answer);
        markInput(inp, true);
        return type === 'xToY' ? `At x = ${fmt(T.x)} the run is at y = ${fmt(T.y)}.` : `The run is at y = ${fmt(T.y)} when x = ${fmt(T.x)}.`;
      },
      lock(on) { locked = on; if (inp) inp.disabled = on; }
    };
  }

  // Run 4 and 5: read the gradient between gates A and B.
  // opts.parts: also ask for rise and run (Red Run), so students show the steps to m.
  function qGradient(d, opts = {}) {
    const { A, B } = d, run = B.x - A.x, rise = B.y - A.y, parts = !!opts.parts;
    let g, panel, inp, riseInp, runInp, val, partsOk = true;
    return {
      key: 'grad' + JSON.stringify([A, B]),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say(parts
          ? `Find the gradient <b>m</b> of this run. Go from gate <b class="nowrap">A ${pt(A)}</b> to gate <b class="nowrap">B ${pt(B)}</b>: count the <b>rise</b> (up is +, down is −) and the <b>run</b> (across), then work out m = rise ÷ run.`
          : 'What is the gradient <b>m</b> of this run? Use gates <b>A</b> and <b>B</b>.');
        g.line(qval(d.m), qval(d.c));
        this.gates = gateFlags(g, [A, B]);
        letterFlag(g, A, 'A'); letterFlag(g, B, 'B');
        g.idleOnLine(qval(d.m), qval(d.c), -5.3);
        if (parts) {
          riseInp = numField(panel.work, 'rise =', '', 'rise from A to B');
          runInp = numField(panel.work, 'run =', '', 'run from A to B');
          // Show buttons: the rise goes straight up or down from A to B's height, then the run goes across to B.
          const D = { x: A.x, y: B.y };
          let runEl = null, riseEl = null, guideEl = null;
          const showRise = () => {
            if (riseEl) riseEl.remove();
            const p = g.grow(A, D, { cls: 'grow-rise', label: i => 'rise ' + (rise < 0 ? L.MINUS : '') + i });
            riseEl = g.layers.guides.lastChild;
            return p;
          };
          const showRun = () => {
            if (runEl) runEl.remove();
            if (guideEl) guideEl.remove();
            guideEl = riseEl && riseEl.isConnected ? null : g.guide([A, D]);
            const p = g.grow(D, B, { cls: 'grow-run', label: i => 'run ' + i, below: rise < 0 });
            runEl = g.layers.guides.lastChild;
            return p;
          };
          for (const [inpEl, fn, what] of [[riseInp, showRise, 'rise'], [runInp, showRun, 'run']]) {
            const b = h(`<button class="help-btn show-btn" type="button" aria-label="Show me the ${what} on the graph" title="Show me the ${what}">?</button>`);
            b.addEventListener('click', async () => { b.disabled = true; await fn(); b.disabled = false; });
            inpEl.closest('.numrow').appendChild(b);
          }
        }
        inp = numField(panel.work, 'm =', '', 'gradient m');
        if (parts) [riseInp, runInp, inp].forEach(i => i.closest('.numrow').classList.add('aligned'));
        setTimeout(() => (riseInp || inp).focus({ preventScroll: true }), 80);
      },
      read() {
        const boxes = parts ? [riseInp, runInp, inp] : [inp];
        const r = readNums(boxes, parts ? 'Fill in rise, run and m.' : 'Type the gradient first.', parts ? [null, null, d.m] : [d.m]);
        if (r.vals) val = r.vals[r.vals.length - 1];
        if (r.vals && parts) this.rr = r.vals;
        return r;
      },
      check() {
        const ok = qeq(val, d.m);
        markInput(inp, ok);
        if (!parts) return { correct: ok, msg: ok ? '' : slopeMsg(val, d.m) };
        const okRise = qeq(this.rr[0], Q(rise)), okRun = qeq(this.rr[1], Q(run));
        markInput(riseInp, okRise); markInput(runInp, okRun);
        partsOk = okRise && okRun;
        let msg = '';
        if (!okRise) msg += 'Check the rise: count up (+) or down (−) from A to B. ';
        if (!okRun) msg += 'Check the run: count the squares across from A to B. ';
        if (!ok) msg += partsOk ? 'Now divide: m = rise ÷ run.' : slopeMsg(val, d.m);
        return { correct: ok && partsOk, msg: msg.trim() };
      },
      async play(res) {
        g.clearLayer('scratch');
        if (res.correct) { await rideTrue(g, d.m, d.c, this.gates); return; }
        // Right m but wrong rise or run: wipe out at gate B.
        if (qeq(val, d.m)) { await g.ride(L.pathTo(qval(d.m), qval(d.c), B.x), { crash: true, gates: [this.gates[0]] }); return; }
        if (val.n !== 0 && Math.sign(val.n) !== Math.sign(d.m.n)) g.arrowFlash();
        await rideStudent(g, val, L.qsub(Q(A.y), L.qmul(val, Q(A.x))), this.gates);
      },
      hint(level) {
        if (level === 1) return 'Reading <b>left to right</b>, is this a lift (up) or a run (down)? Then count the squares across and up or down from A to B.';
        g.triangle(A, B);
        return `From A to B: run ${run}, rise ${fmt(rise)}. Gradient is rise ÷ run.`;
      },
      solve() {
        g.clearLayer('guides');
        g.triangle(A, B);
        if (parts) { riseInp.value = fmt(rise); runInp.value = fmt(run); markInput(riseInp, true); markInput(runInp, true); }
        inp.value = qInput(d.m);
        markInput(inp, true);
        return `rise = ${fmt(rise)}, run = ${run}, so m = rise ÷ run = ${fmt(rise)} ÷ ${run} = <b>${qpretty(d.m)}</b>.`;
      },
      lock(on) { inp.disabled = on; if (parts) { riseInp.disabled = on; runInp.disabled = on; } }
    };
  }

  // Run 4: drag to build a run with a given gradient.
  function qBuild(d) {
    const { A } = d, mN = d.m.n;
    let g, panel, hd, B, lineEl, tri;
    const redraw = () => {
      if (lineEl) lineEl.remove();
      if (tri) tri.remove();
      const m = (B.y - A.y) / (B.x - A.x);
      lineEl = g.line(m, A.y - m * A.x, { cls: 'built' });
      tri = g.triangle(A, B, { labels: false, cls: 'quiet' });
    };
    return {
      key: 'build' + mN + JSON.stringify(A),
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say(`Build a run with gradient <b>m = ${fmt(mN)}</b>. Drag the orange handle (or select it and use the arrow keys).`);
        this.gateA = gateFlags(g, [A])[0];
        letterFlag(g, A, 'A');
        B = { x: A.x + 1, y: A.y };
        hd = g.handle(B, { constrain: q => ({ x: Math.max(q.x, A.x + 1), y: q.y }), onMove: p => { B = p; redraw(); }, label: 'Slope handle' });
        redraw();
        panel.work.appendChild(h('<p class="counter">Count the squares: how far up or down for each 1 across?</p>'));
      },
      read() { return { status: 'ok' }; },
      check() {
        const mAns = Q(B.y - A.y, B.x - A.x);
        this.mAns = mAns;
        return { correct: qeq(mAns, d.m), msg: qeq(mAns, d.m) ? '' : slopeMsg(mAns, d.m) };
      },
      async play(res) {
        const mv = qval(this.mAns), cv = A.y - mv * A.x;
        const gates = [this.gateA, { x: B.x, y: B.y }];
        if (res.correct) { await g.ride(L.clipLine(mv, cv), { gates }); return; }
        if (this.mAns.n !== 0 && Math.sign(this.mAns.n) !== Math.sign(mN)) g.arrowFlash();
        await g.ride(L.pathTo(mv, cv, B.x), { crash: true, gates: [this.gateA] });
      },
      hint(level) {
        if (level === 1) return `m = ${fmt(mN)} means <b>${mN > 0 ? 'up' : 'down'} ${Math.abs(mN)}</b> for every <b>1 across</b>. Reading left to right, that is ${mN > 0 ? 'a lift going up' : 'a run going down'}.`;
        g.triangle(A, { x: A.x + 1, y: A.y + mN }, { cls: 'ghost' });
        return `Here is one step from A: run 1, rise ${fmt(mN)}. Put the handle at the end of it.`;
      },
      solve() {
        B = { x: A.x + 1, y: A.y + mN };
        hd.set(B);
        redraw();
        return `Run 1, rise ${fmt(mN)}, so m = ${fmt(mN)} ÷ 1 = <b>${fmt(mN)}</b>.`;
      },
      lock(on) { g.lockHandles(on); }
    };
  }

  // Run 5: write y = mx + c from a graph.
  function qEquation(d) {
    const { gates: gts } = d;
    let g, panel, f, ans;
    return {
      key: 'eq' + qpretty(d.m) + ',' + d.c.n,
      mount(ctx) {
        ({ g, panel } = ctx);
        panel.say('Write the equation of this run.');
        g.line(qval(d.m), qval(d.c));
        this.gates = gateFlags(g, gts);
        g.idleOnLine(qval(d.m), qval(d.c), -5.3);
        f = eqField(panel.work);
